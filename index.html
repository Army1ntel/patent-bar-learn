{id:"publication",track:"III",fig:"3.5",title:"Publication, Secrecy, and Third Parties",
 blurb:"Eighteen-month publication, the nonpublication request trap, protests and preissuance submissions.",
 teach:[{h:"Publication",p:[
  "[[pubgrant|Pre-grant publication]] occurs promptly after eighteen months from the earliest filing date for which benefit is sought. Publication opens the file to the public and creates provisional rights under 35 U.S.C. 154(d) — a reasonable royalty from the date of publication if the issued claims are substantially identical to the published ones and the infringer had actual notice.",
  "A [[nonpub|nonpublication request]] avoids publication, but only if the applicant certifies at the time of filing that the invention has not been and will not be the subject of an application filed in another country or under a multilateral agreement requiring eighteen-month publication. If the applicant later files abroad anyway, the Office must be notified within 45 days — and failure to do so makes the application abandoned. That deadline is a favorite of exam writers."]},
  {h:"Third parties looking in",p:[
   "A [[presub|third-party preissuance submission]] under 37 CFR 1.290 may include patents, published applications, or other printed publications, each with a concise description of relevance. It must be filed before the earlier of a notice of allowance, or the later of six months after publication or the first rejection of any claim.",
   "A [[protest|protest]] under 37 CFR 1.291 may include a broader range of information, but must be filed before publication or the mailing of a notice of allowance, whichever occurs first, unless the applicant consents.",
   "Unpublished applications remain confidential under 35 U.S.C. 122(a); access by others requires the applicant's written authority or a showing under 37 CFR 1.14. And subject matter that might harm national security can be placed under a secrecy order, which withholds the grant and bars foreign filing while it is in force."]}],
 qs:[
 {q:"An applicant filed a nonpublication request at filing, then filed a counterpart application in Europe eight months later. What must the applicant do?",
  o:["Nothing; the nonpublication request lapses automatically","Notify the Office of the foreign filing within 45 days of that filing, or the application becomes abandoned","File a petition under 37 CFR 1.183","Withdraw the foreign application","Notify the Office within six months"],a:1,
  why:"Section 122(b)(2)(B)(iii) requires notice within 45 days of the foreign filing. Failure makes the application abandoned, although revival may be available where the delay was unintentional.",
  cite:"35 U.S.C. 122(b)(2)(B)(iii); 37 CFR 1.213(c); MPEP 1123"},
 {q:"When may a nonpublication request be filed?",
  o:["Any time before publication","Only upon filing of the application","Within three months of filing","Any time before allowance","Only after a first Office action"],a:1,
  why:"The request must be submitted with the application upon filing, and it must include the required certification regarding foreign filing.",
  cite:"37 CFR 1.213(a); MPEP 1122"},
 {q:"Pre-grant publication occurs:",
  o:["Twelve months after filing","Promptly after eighteen months from the earliest filing date for which benefit is sought","At thirty months from the priority date","Only upon request","Six months before issuance"],a:1,
  why:"Section 122(b) requires publication promptly after the expiration of eighteen months from the earliest filing date for which a benefit is sought, subject to the exceptions.",
  cite:"35 U.S.C. 122(b)(1); 37 CFR 1.211; MPEP 1120"},
 {q:"Provisional rights under 35 U.S.C. 154(d) require which of the following?",
  o:["That the infringer had actual notice of the published application, and that the issued claims are substantially identical to the published claims","That the application was filed abroad","That the applicant marked its products","That a protest was filed","That the patent issued within two years of publication"],a:0,
  why:"A patentee may obtain a reasonable royalty for the period between publication and issuance only where the infringer had actual notice of the published application and the invention as claimed in the patent is substantially identical to the published claims.",
  cite:"35 U.S.C. 154(d); MPEP 2120"},
 {q:"A third-party preissuance submission under 37 CFR 1.290 must be filed before:",
  o:["The application publishes","The earlier of a notice of allowance, or the later of six months after publication or the first rejection of any claim","Any Office action issues","Six months after filing","The examiner completes the first search"],a:1,
  why:"Rule 290(b) sets exactly that timing, and each item submitted must be accompanied by a concise description of its asserted relevance.",
  cite:"37 CFR 1.290(b); MPEP 1134.01"},
 {q:"A protest under 37 CFR 1.291 must be filed:",
  o:["Any time before issuance","Before publication or the mailing of a notice of allowance, whichever occurs first, unless the applicant consents","Only after the first Office action","Within two months of publication","Only in reissue applications"],a:1,
  why:"That timing governs protests in pending applications. Protests in reissue applications follow their own practice and are handled differently.",
  cite:"37 CFR 1.291(b); MPEP 1901.04"},
 {q:"Which is most correct about access to an unpublished pending application?",
  o:["Any member of the public may inspect it","It is preserved in confidence, and access requires the applicant's written authority or a showing satisfying 37 CFR 1.14","It becomes public once a first Office action issues","It is available to anyone who pays a fee","It is available to any registered practitioner"],a:1,
  why:"Section 122(a) preserves pending applications in confidence, subject to the limited access provisions of Rule 14 and to special circumstances determined by the Director.",
  cite:"35 U.S.C. 122(a); 37 CFR 1.14; MPEP 103"}
]},

{id:"term",track:"III",fig:"3.7",title:"Patent Term, Adjustment, and Extension",
 blurb:"Twenty years from when, plus PTA for Office delay and PTE for regulatory review.",
 teach:[{h:"The base term",p:[
  "A utility or plant patent runs twenty years from the earliest U.S. nonprovisional filing date to which benefit is claimed under sections 120, 121, 365(c), or 386(c) — or from the international filing date of a PCT application. A [[provisional|provisional]] does not start the clock, which is precisely why filing one is attractive. A design patent issued from an application filed on or after May 13, 2015 runs fifteen years from grant.",
  "Term can be cut by a [[td|terminal disclaimer]], which is the price of overcoming obviousness-type double patenting."]},
  {h:"Adding time back",p:[
   "[[pta|Patent term adjustment]] restores time lost to the Office. The A delays are missed examination deadlines: no first action within fourteen months, no response to a reply within four months, no action within four months of a Board decision, no issuance within four months of the issue fee. The B delay is pendency beyond three years, excluding time consumed by RCEs, appeals, and interferences. The C delays cover interferences, secrecy orders, and successful appeals. Overlapping periods are counted only once.",
   "Then the adjustment is reduced by the applicant's own delay — any period in which the applicant failed to engage in reasonable efforts to conclude prosecution, including taking more than three months to reply to an Office communication.",
   "[[pte|Patent term extension]] under section 156 is a different animal, restoring time lost to regulatory review of products such as drugs and medical devices, capped at five years, with the remaining term after approval limited to fourteen years."]}],
 qs:[
 {q:"A nonprovisional was filed June 1, 2018 claiming benefit of a provisional filed June 1, 2017, and issued in 2021. When does the term expire, absent adjustment?",
  o:["June 1, 2037","June 1, 2038","Twenty years from issuance","Seventeen years from issuance","Twenty years from the provisional filing date"],a:1,
  why:"The term runs twenty years from the earliest U.S. nonprovisional filing date. A provisional does not count for term purposes, even though it counts for prior art purposes.",
  cite:"35 U.S.C. 154(a)(2), (a)(3); MPEP 2701"},
 {q:"A design patent issuing from an application filed in 2020 has a term of:",
  o:["Fourteen years from grant","Fifteen years from grant","Twenty years from filing","Seventeen years from grant","Twenty years from grant"],a:1,
  why:"For design applications filed on or after May 13, 2015, the term is fifteen years from grant. Design patents require no maintenance fees.",
  cite:"35 U.S.C. 173; MPEP 1505"},
 {q:"Which of the following is an 'A delay' for patent term adjustment purposes?",
  o:["Pendency exceeding three years","Failure of the Office to mail a first Office action within fourteen months of filing","Delay due to a secrecy order","Delay due to a successful appeal","Delay caused by the applicant's request for continued examination"],a:1,
  why:"The A delays are the Office's failures to meet specified examination deadlines, of which the fourteen-month first action deadline is the first. Three-year pendency is a B delay; interferences, secrecy orders, and successful appeals are C delays.",
  cite:"35 U.S.C. 154(b)(1)(A); MPEP 2731"},
 {q:"An applicant takes five months to reply to an Office action, using extensions of time. What is the effect on patent term adjustment?",
  o:["None","Any accumulated adjustment is reduced by the period in excess of three months","The adjustment is forfeited entirely","The term is extended by two months","The applicant must file a terminal disclaimer"],a:1,
  why:"An applicant is deemed to have failed to engage in reasonable efforts for any period beyond three months from the date of an Office communication, and the adjustment is reduced day for day.",
  cite:"35 U.S.C. 154(b)(2)(C); 37 CFR 1.704(b); MPEP 2732"},
 {q:"Patent term extension under 35 U.S.C. 156 is available for:",
  o:["Any delay caused by the Office","Time lost to regulatory review of a product such as a drug or medical device, capped at five years","Delay caused by an interference","Time spent in an inter partes review","Any patent upon payment of a fee"],a:1,
  why:"Section 156 restores a portion of the term consumed by premarket regulatory review, subject to the five-year cap and the fourteen-year post-approval limit.",
  cite:"35 U.S.C. 156; MPEP 2751"},
 {q:"Which time period is excluded from the three-year pendency calculation for B delay?",
  o:["Time consumed by continued examination under 35 U.S.C. 132(b), appellate review, and interference or derivation proceedings","Time consumed by the examiner's search","Time between the first and second Office actions","Time spent preparing the application","Time after the issue fee is paid"],a:0,
  why:"The three-year guarantee excludes time consumed by continued examination, by interference, derivation, secrecy order, or appellate review, and by any delay requested by the applicant.",
  cite:"35 U.S.C. 154(b)(1)(B); MPEP 2731"}
]},

{id:"design",track:"IV",fig:"4.1",title:"Design Patents",
 blurb:"One claim, the drawings as the disclosure, and where design practice diverges.",
 teach:[{h:"What a design patent is",p:[
  "Section 171 protects a new, original, and ornamental design for an article of manufacture. Ornamental is the operative word: a design dictated solely by function is not protectable, and the requirement is judged by whether the design is primarily ornamental rather than primarily functional.",
  "A design application has exactly one claim, and it is formulaic: the ornamental design for the article as shown, or as shown and described. The drawings are the disclosure — they define the claim in a way no utility drawing does. Solid lines show the claimed design; [[broken|broken lines]] show environment or unclaimed portions, and adding or converting lines can raise new matter questions."]},
  {h:"Where design practice diverges",p:[
   "The term is fifteen years from grant for applications filed on or after May 13, 2015, and there are no maintenance fees. Foreign priority must be claimed within six months rather than twelve. A [[rce|request for continued examination]] is unavailable; a design applicant uses a [[cpa|continued prosecution application]] under 37 CFR 1.53(d) instead.",
   "For anticipation and infringement, the [[ordobs|ordinary observer test]] governs: whether an ordinary observer, giving the attention a purchaser usually gives, would think the two designs substantially the same. Obviousness in design cases requires a primary reference with basically the same design characteristics before secondary references may be used to modify it."]}],
 qs:[
 {q:"How many claims may a design application contain?",
  o:["One","Three","As many as the drawings support","One independent and up to twenty dependent","Unlimited"],a:0,
  why:"A design application may include only one claim, in the formal terms prescribed by rule, defining the design as shown or as shown and described.",
  cite:"37 CFR 1.153(a); MPEP 1503.01"},
 {q:"What is the term of a design patent issuing from an application filed on or after May 13, 2015?",
  o:["Fourteen years from grant","Fifteen years from grant","Twenty years from filing","Seventeen years from filing","Fifteen years from filing"],a:1,
  why:"The term is fifteen years from the date of grant, and no maintenance fees are due.",
  cite:"35 U.S.C. 173; MPEP 1505"},
 {q:"In a design patent drawing, broken lines are used to:",
  o:["Show the claimed design","Indicate hidden interior structure that is claimed","Show environment or portions of the article that form no part of the claimed design","Indicate color","Indicate a variation of the claimed design that is also claimed"],a:2,
  why:"Broken lines depict unclaimed subject matter or environmental structure. Only the solid lines define the claimed design.",
  cite:"37 CFR 1.152; MPEP 1503.02"},
 {q:"Which procedural option is NOT available in a design application?",
  o:["A continued prosecution application under 37 CFR 1.53(d)","A request for continued examination under 37 CFR 1.114","An appeal to the PTAB","A divisional application","A petition under 37 CFR 1.181"],a:1,
  why:"Rule 114(e) excludes design applications from RCE practice. Design applicants use a CPA, which remains available only for designs.",
  cite:"37 CFR 1.114(e), 1.53(d); MPEP 1504.01"},
 {q:"A foreign priority claim in a design application must be made within:",
  o:["Six months of the foreign filing","Twelve months of the foreign filing","Eighteen months of the foreign filing","Thirty months of the priority date","Any time before allowance"],a:0,
  why:"Section 172 gives design applications a six-month priority period rather than the twelve months available for utility applications.",
  cite:"35 U.S.C. 172; MPEP 1504.10"},
 {q:"A design is dictated solely by the function of the article. Which is most correct?",
  o:["It is patentable as a design because it is new","It is not patentable as a design, because the design must be primarily ornamental","It is patentable if the applicant disclaims the functional features","It should be examined under 35 U.S.C. 101 as a machine","It is patentable if no alternative design exists"],a:1,
  why:"An article whose configuration is dictated solely by function is not proper subject matter for a design patent; the design must be primarily ornamental.",
  cite:"35 U.S.C. 171; MPEP 1504.01(c)"},
 {q:"The test for anticipation of a design claim is:",
  o:["The person of ordinary skill test","The ordinary observer test — whether an ordinary observer would think the two designs substantially the same","Whether every reference numeral matches","Whether the articles serve the same function","Whether the designs share a common author"],a:1,
  why:"The ordinary observer test governs design anticipation, asking whether the two designs would appear substantially the same to an ordinary observer giving the attention a purchaser usually gives.",
  cite:"MPEP 1504.02"}
]},

{id:"plant",track:"IV",fig:"4.2",title:"Plant Patents",
 blurb:"Asexual reproduction, one claim, and the boundaries of section 161.",
 teach:[{h:"What qualifies",p:[
  "Section 161 covers whoever invents or discovers and [[asexual|asexually reproduces]] a distinct and new variety of plant. Two exclusions matter: tuber-propagated plants, and plants found in an uncultivated state. A seedling discovered in a cultivated area and then asexually reproduced can qualify; the same seedling found in the wild cannot.",
  "Note the word 'discovers.' Plant patents are the one place where discovery alone, coupled with asexual reproduction, supports a patent. Sexually reproduced varieties are protected instead through Plant Variety Protection certificates issued by the Department of Agriculture, not by the USPTO."]},
  {h:"Practice differences",p:[
   "A plant application contains a single claim, drawn to the plant as described and illustrated. Drawings must be artistically and competently executed, and may be in color where color is a distinguishing characteristic. The description need only be as complete as reasonably possible, a relaxation of the ordinary 112 standard in recognition of biological variability.",
   "Term is twenty years from filing, and no maintenance fees are due. The grant excludes others from asexually reproducing the plant, and from using, offering for sale, or selling the plant so reproduced or any of its parts."]}],
 qs:[
 {q:"Which plant is expressly excluded from plant patent protection under 35 U.S.C. 161?",
  o:["A new variety of rose reproduced by cutting","A tuber-propagated plant","A hybrid discovered in a cultivated field and reproduced by grafting","A new variety of apple tree reproduced by budding","A mutant discovered in a nursery and reproduced by tissue culture"],a:1,
  why:"Section 161 excludes tuber-propagated plants and plants found in an uncultivated state. Everything else asexually reproduced may qualify.",
  cite:"35 U.S.C. 161; MPEP 1601"},
 {q:"How many claims may a plant patent application contain?",
  o:["One","Two","Three","Twenty","Unlimited"],a:0,
  why:"The plant application must include a single claim, in formal terms, directed to the plant as described and illustrated.",
  cite:"37 CFR 1.164; MPEP 1605"},
 {q:"A gardener discovers a distinct new variety growing wild in a national forest and asexually reproduces it. Which is most correct?",
  o:["A plant patent is available because the variety was asexually reproduced","A plant patent is not available because the plant was found in an uncultivated state","A plant patent is available if the gardener obtains a permit","Only a utility patent is available for the plant","A Plant Variety Protection certificate must be obtained first"],a:1,
  why:"A plant found in an uncultivated state is excluded, regardless of subsequent asexual reproduction. Discovery in a cultivated area is treated differently.",
  cite:"35 U.S.C. 161; MPEP 1601"},
 {q:"The description in a plant patent application must be:",
  o:["Identical in rigor to that of a utility application under 112(a)","As complete as is reasonably possible","Limited to the color of the plant","Accompanied by a deposit in every case","Signed by a botanist"],a:1,
  why:"Section 162 relaxes the description standard for plant applications, requiring that the description be as complete as is reasonably possible.",
  cite:"35 U.S.C. 162; MPEP 1605"},
 {q:"Rights conferred by a plant patent include the right to exclude others from:",
  o:["Growing any plant of the same species","Asexually reproducing the plant, and using, offering for sale, or selling the plant so reproduced or any of its parts","Selling seeds of any variety","Importing any plant product","Publishing photographs of the plant"],a:1,
  why:"Section 163 defines the rights in those terms, keyed to asexual reproduction and to the plant so reproduced.",
  cite:"35 U.S.C. 163; MPEP 1601"},
 {q:"A new variety that is sexually reproduced by seed is best protected by:",
  o:["A plant patent under 35 U.S.C. 161","A Plant Variety Protection certificate from the Department of Agriculture, or a utility patent","A design patent","A certificate of correction","A trademark registration"],a:1,
  why:"Plant patents require asexual reproduction. Sexually reproduced varieties fall under the Plant Variety Protection Act administered by the USDA, and utility patent protection may also be available.",
  cite:"MPEP 1601"}
]}
);
/* ============ STATE ============ */
const KEY="patentBarV1";
const TORDER={I:0,II:1,III:2,IV:3};
MODULES.sort((a,b)=>(TORDER[a.track]-TORDER[b.track])||a.fig.localeCompare(b.fig));
const ALLQ={};
MODULES.forEach(m=>m.qs.forEach((q,i)=>{q.id=m.id+"-"+i;q.mod=m.id;ALLQ[q.id]=q;}));
const TRACKS={I:"Track I \u00b7 Foundations",II:"Track II \u00b7 Filing & Patentability",III:"Track III \u00b7 Prosecution & Post-Issuance",IV:"Track IV \u00b7 Design & Plant"};

let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.q)return r;}catch(e){}
  return {xp:0,answered:0,nextReinforce:25,q:{},seen:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function qs(id){if(!S.q[id])S.q[id]={r:0,w:0,s:0,m:false};return S.q[id];}

/* ============ TEXT RENDERING ============ */
let NUMS={},NUMN=0;
function resetNums(){NUMS={};NUMN=0;}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(t){
  let s=esc(t);
  s=s.replace(/\[\[([a-z0-9]+)\|([^\]]+)\]\]/g,(m,k,disp)=>{
    if(!GLOSSARY[k])return disp;
    if(!NUMS[k]){NUMN+=2;NUMS[k]=NUMN;}
    return '<button class="term" onclick="showTerm(\''+k+'\')">'+disp+'<sup>'+NUMS[k]+'</sup></button>';
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  return s;
}
function showTerm(k){
  const g=GLOSSARY[k];if(!g)return;
  const n=NUMS[k]?String(NUMS[k]):"\u2014";
  openSheet('<div class="num">REF. '+n+'</div><h4>'+esc(g.t)+'</h4><p>'+esc(g.d)+'</p><div class="cite">'+esc(g.c)+'</div>');
}
function openSheet(html){
  document.getElementById("sheet").innerHTML=html;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

/* ============ PROGRESS HELPERS ============ */
function modStats(m){
  let seen=0,mast=0;
  m.qs.forEach(q=>{const r=S.q[q.id];if(r&&(r.r+r.w)>0)seen++;if(r&&r.m)mast++;});
  return {seen:seen,mast:mast,total:m.qs.length};
}
function totals(){
  let mast=0,seen=0,total=0;
  MODULES.forEach(m=>{const t=modStats(m);mast+=t.mast;seen+=t.seen;total+=t.total;});
  return {mast:mast,seen:seen,total:total};
}
function weakPool(){
  return Object.keys(S.q).filter(id=>ALLQ[id]&&S.q[id].w>0&&!S.q[id].m).map(id=>ALLQ[id]);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ============ HOME ============ */
let L=null;
function home(){
  L=null;resetNums();
  const t=totals();
  let h='<div class="hero"><div class="kick">USPTO REGISTRATION EXAMINATION</div>'
   +'<h2>Ninety scored questions.<br>Sixty-three to pass.</h2>'
   +'<p>'+MODULES.length+' modules, '+t.total+' questions, every answer cited. Read the explanation, answer until each question is mastered, and let the weak ones come back to you.</p>'
   +'<div class="statrow"><div><b>'+t.mast+'</b>MASTERED</div><div><b>'+t.seen+'</b>ATTEMPTED</div><div><b>'+S.answered+'</b>ANSWERS LOGGED</div></div></div>';

  const wp=weakPool().length;
  h+='<div class="quick">'
   +'<button class="qbtn" onclick="startWeak()"'+(wp?"":" disabled")+'><b>Weak spots</b><span>'+(wp?wp+" QUESTIONS WAITING":"NOTHING MISSED YET")+'</span></button>'
   +'<button class="qbtn" onclick="startMock(20)"><b>Mixed drill</b><span>20 QUESTIONS \u00b7 EXAM PACE</span></button>'
   +'<button class="qbtn" onclick="startMock(50)"><b>Half session</b><span>50 QUESTIONS \u00b7 3 HOURS</span></button>'
   +'<button class="qbtn" onclick="glossary()"><b>Glossary</b><span>'+Object.keys(GLOSSARY).length+' TERMS</span></button>'
   +'</div>';

  ["I","II","III","IV"].forEach(tr=>{
    const mods=MODULES.filter(m=>m.track===tr);
    const done=mods.reduce((a,m)=>a+modStats(m).mast,0);
    const all=mods.reduce((a,m)=>a+m.qs.length,0);
    h+='<div class="tracklbl"><span>'+TRACKS[tr].toUpperCase()+'</span><span>'+done+'/'+all+'</span></div>';
    mods.forEach(m=>{
      const st=modStats(m);
      const pm=Math.round(st.mast/st.total*100),ps=Math.round(Math.max(0,st.seen-st.mast)/st.total*100);
      h+='<button class="mod" onclick="startLesson(\''+m.id+'\')">'
       +(st.mast===st.total?'<span class="seal">ALLOWED</span>':'')
       +'<div class="top"><span class="fig">'+m.fig+'</span><span class="name">'+esc(m.title)+'</span></div>'
       +'<div class="blurb">'+esc(m.blurb)+'</div>'
       +'<div class="bar"><i class="m" style="width:'+pm+'%"></i><i class="s" style="width:'+ps+'%"></i></div>'
       +'<div class="meta">'+st.mast+' OF '+st.total+' MASTERED</div></button>';
    });
  });
  h+='<div class="colophon"><b>COLOPHON</b>Patent Bar Learn \u00b7 version 2.0, July 2026. Built by Ernest N. Sumrall, MEng \u2014 registered inventor on three U.S. patents \u2014 under <a href="https://ernestsumrall.com" target="_blank" rel="noopener">BIOMITEK</a>. More at <a href="https://ernestsumrall.com" target="_blank" rel="noopener">ernestsumrall.com</a>. Free to use and free to share.</div>';
h+='<div class="note">Built from MPEP Ninth Edition, Revision 01.2024 and the published exam source materials \u00b7 '+MODULES.length+' modules \u00b7 '+t.total+' questions \u00b7 '+Object.keys(GLOSSARY).length+' glossary terms. Not affiliated with, endorsed by, or sponsored by the United States Patent and Trademark Office. Every answer carries its citation \u2014 verify anything that surprises you against the MPEP itself before relying on it. Fact patterns dated before March 16, 2013 are governed by pre-AIA law; check the date first, every time. This is a study aid, not legal advice.</div>';  document.getElementById("app").innerHTML=h;
  document.getElementById("xp").textContent=S.xp+" XP";
  window.scrollTo(0,0);
}

/* ============ LESSON ENGINE ============ */
function buildQueue(mod,opts){
  opts=opts||{};
  const q=[];
  if(!opts.noTeach&&mod.teach){
    const allMast=mod.qs.every(x=>S.q[x.id]&&S.q[x.id].m);
    if(!allMast||opts.forceTeach)mod.teach.forEach(t=>q.push({teach:t}));
  }
  const items=opts.order?opts.order:mod.qs;
  items.forEach(x=>q.push({q:x}));
  return q;
}
function startLesson(id,force){
  const m=MODULES.filter(x=>x.id===id)[0];if(!m)return;
  L={mode:"lesson",title:m.title,fig:m.fig,queue:buildQueue(m,{forceTeach:force}),i:0,got:0,asked:0};
  step();
}
function reviewTeach(id){startLesson(id,true);}
function startWeak(){
  const pool=shuffle(weakPool()).slice(0,20);if(!pool.length)return;
  L={mode:"weak",title:"Weak spots",fig:"\u2726",queue:pool.map(q=>({q:q})),i:0,got:0,asked:0};
  step();
}
function startMock(n){
  n=n||20;
  const pool=shuffle(Object.keys(ALLQ).map(k=>ALLQ[k])).slice(0,n);
  L={mode:"mock",title:n>=50?"Half session":"Mixed drill",fig:"\u00a7",queue:pool.map(q=>({q:q})),i:0,got:0,asked:0,t0:Date.now()};
  step();
}
function quit(){if(L&&L.mode==="reinforce"&&L.prev){L=L.prev;step();return;}home();}

function frame(inner){
  const pct=L.queue.length?Math.round(L.i/L.queue.length*100):0;
  return '<div class="crumb"><button class="x" onclick="quit()" aria-label="Close">\u2715</button>'
   +'<span class="t">'+esc(L.fig)+' \u00b7 '+esc(L.title.toUpperCase())+'</span>'
   +'<span class="t" style="flex:none">'+Math.min(L.i+1,L.queue.length)+'/'+L.queue.length+'</span></div>'
   +'<div class="pbar"><i style="width:'+pct+'%"></i></div>'+inner;
}
function paint(inner){
  document.getElementById("app").innerHTML=frame(inner);
  document.getElementById("xp").textContent=S.xp+" XP";
  window.scrollTo(0,0);
}
function step(){
  if(!L)return home();
  if(L.i>=L.queue.length)return finish();
  const item=L.queue[L.i];
  if(item.teach)return showTeach(item.teach);
  showQuestion(item);
}
function showTeach(t){
  resetNums();
  let h='<div class="card teach"><div class="eyebrow">EXPLANATION</div><h3>'+esc(t.h)+'</h3>';
  t.p.forEach(p=>h+="<p>"+md(p)+"</p>");
  h+='</div><button class="cta" onclick="advance()">CONTINUE</button>';
  paint(h);
}
function advance(){L.i++;step();}

function showQuestion(item){
  resetNums();
  const q=item.q;
  if(!item._opts){
    const idx=q.o.map((t,i)=>({t:t,ok:i===q.a}));
    item._opts=shuffle(idx);
  }
  const rec=qs(q.id);
  let h="";
  if(item.cue){
    h+='<div class="card teach"><div class="eyebrow">QUICK REFRESHER</div><p>'+md(item.cue)+'</p></div>';
  }
  h+='<div class="card"><div class="eyebrow">QUESTION'+(rec.m?" \u00b7 MASTERED":(rec.w>0?" \u00b7 MISSED BEFORE":""))+'</div>'
   +'<p class="qtext">'+md(q.q)+'</p><div class="opts" id="opts">';
  item._opts.forEach((o,i)=>{
    h+='<button class="opt" onclick="answer('+i+')"><span class="ltr">('+"ABCDE"[i]+')</span><span>'+md(o.t)+'</span></button>';
  });
  h+="</div></div>";
  paint(h);
}
function answer(i){
  const item=L.queue[L.i],q=item.q,rec=qs(q.id);
  const ok=item._opts[i].ok;
  const btns=document.querySelectorAll("#opts .opt");
  for(let k=0;k<btns.length;k++){
    btns[k].disabled=true;
    if(item._opts[k].ok)btns[k].className="opt ok";
    else if(k===i)btns[k].className="opt no";
  }
  let demoted=false;
  if(ok){rec.r++;rec.s++;S.xp+=10;if(!rec.m&&rec.s>=3){rec.m=true;S.xp+=15;}L.got++;}
  else{rec.w++;rec.s=0;if(rec.m){rec.m=false;demoted=true;}}
  L.asked++;S.answered++;save();
  document.getElementById("xp").textContent=S.xp+" XP";

  let h='<div class="fb '+(ok?"ok":"no")+'"><div class="hd">'+(ok?"CORRECT":"NOT QUITE")+'</div>';
  if(ok&&rec.m&&rec.s===3)h+="<p><strong>Mastered.</strong> Three correct in a row \u2014 this one drops out of rotation.</p>";
  if(demoted)h+="<p><strong>Demoted.</strong> This one was mastered; it drops back into rotation.</p>";
  h+="<p>"+md(q.why)+'</p><div class="cite">'+esc(q.cite)+"</div></div>";
  h+='<button class="cta" onclick="next()">'+(L.i+1>=L.queue.length?"FINISH":"NEXT")+"</button>";
  document.getElementById("app").insertAdjacentHTML("beforeend",h);
  const fb=document.querySelector(".fb");if(fb&&fb.scrollIntoView)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){
  if(L.mode!=="reinforce"&&S.answered>=S.nextReinforce&&weakPool().length>=4)return offerReinforce();
  L.i++;step();
}
function offerReinforce(){
  S.nextReinforce=S.answered+25;save();
  paint('<div class="card teach"><div class="eyebrow">CHECKPOINT</div><h3>Reinforcement Round</h3>'
   +"<p>You have answered "+S.answered+" questions. Before going on, here are the ones that have been giving you trouble \u2014 no explanations, just the questions.</p>"
   +'</div><button class="cta" onclick="doReinforce()">RUN THE ROUND</button>'
   +'<button class="cta ghost" onclick="skipReinforce()">NOT NOW</button>');
}
function skipReinforce(){L.i++;step();}
function doReinforce(){
  const pool=shuffle(weakPool()).slice(0,6);
  const prev=L;prev.i=prev.i+1;
  L={mode:"reinforce",title:"Reinforcement round",fig:"\u21ba",queue:pool.map(q=>({q:q})),i:0,got:0,asked:0,prev:prev};
  step();
}
function finish(){
  if(L.mode==="reinforce"){
    const prev=L.prev,got=L.got,asked=L.asked;
    paint('<div class="card"><div class="eyebrow">ROUND COMPLETE</div><h3>'+got+" of "+asked+" correct</h3>"
     +"<p>Back to where you left off.</p></div>"
     +'<button class="cta" onclick="resumeLesson()">BACK TO MY LESSON</button>');
    L._resume=prev;return;
  }
  const pctv=L.asked?Math.round(L.got/L.asked*100):0;
  const pass=pctv>=70;
  let h='<div class="card"><div class="eyebrow">'+(L.mode==="mock"?"DRILL COMPLETE":"MODULE COMPLETE")+'</div>'
   +"<h3>"+L.got+" of "+L.asked+" \u2014 "+pctv+"%</h3>"
   +"<p>"+(pass?"That is above the 70% line. Keep the mastered ones cycling and the weak ones will thin out.":"Below the 70% pass line. The ones you missed are now in your weak-spot pool \u2014 run that next.")+"</p>";
  if(L.mode==="mock"&&L.t0){
    const mins=Math.round((Date.now()-L.t0)/60000);
    const budget=Math.round(L.asked*1.8);
    h+="<p>Elapsed: about "+mins+" minute"+(mins===1?"":"s")+". At exam pace "+L.asked+" questions is about "+budget+" minutes \u2014 three hours for fifty.</p>";
  }
  h+="</div>";
  if(weakPool().length)h+='<button class="cta" onclick="startWeak()">DRILL MY WEAK SPOTS</button>';
  h+='<button class="cta ghost" onclick="home()">BACK TO MODULES</button>';
  paint(h);save();
}
function resumeLesson(){L=L._resume;step();}

/* ============ GLOSSARY ============ */
function glossary(){
  L=null;resetNums();
  let h='<div class="crumb"><button class="x" onclick="home()" aria-label="Close">\u2715</button><span class="t">GLOSSARY \u00b7 '+Object.keys(GLOSSARY).length+' TERMS</span></div>'
   +'<input class="gsearch" id="gs" placeholder="Filter terms\u2026" oninput="gfilter()">'
   +'<div id="glist">'+glist("")+"</div>";
  document.getElementById("app").innerHTML=h;window.scrollTo(0,0);
}
function glist(f){
  f=(f||"").toLowerCase();
  const keys=Object.keys(GLOSSARY).sort((a,b)=>GLOSSARY[a].t.localeCompare(GLOSSARY[b].t));
  let h="";
  keys.forEach(k=>{
    const g=GLOSSARY[k];
    if(f&&(g.t+" "+g.d).toLowerCase().indexOf(f)<0)return;
    h+='<div class="gterm"><b>'+esc(g.t)+"</b><p>"+esc(g.d)+'</p><div class="cite">'+esc(g.c)+"</div></div>";
  });
  return h||'<div class="gterm"><p>No terms match that.</p></div>';
}
function gfilter(){document.getElementById("glist").innerHTML=glist(document.getElementById("gs").value);}

/* ============ SETTINGS ============ */
function openSettings(){
  const t=totals(),wp=weakPool().length;
  openSheet('<div class="num">PROGRESS</div><h4>Where you stand</h4>'
   +"<p>"+t.mast+" of "+t.total+" questions mastered \u00b7 "+t.seen+" attempted \u00b7 "+S.answered+" answers logged \u00b7 "+wp+" in the weak-spot pool \u00b7 "+S.xp+" XP.</p>"
   +"<p>Mastery means three correct in a row. Miss a mastered question and it drops back into rotation.</p>"
   +'<button class="cta ghost" onclick="closeSheet();home()">CLOSE</button>'
   +'<button class="cta" style="background:var(--red)" onclick="wipe()">ERASE ALL PROGRESS</button>');
}
function wipe(){
  if(!confirm("Erase all progress? This cannot be undone."))return;
  S={xp:0,answered:0,nextReinforce:25,q:{},seen:{}};save();closeSheet();home();
}

/* ============ BOOT ============ */
window.g={MODULES:MODULES,ALLQ:ALLQ,GLOSSARY:GLOSSARY,qs:qs,get S(){return S;},get L(){return L;},set L(v){L=v;},
  startLesson:startLesson,step:step,answer:answer,showQuestion:showQuestion,weakPool:weakPool,home:home};
home();
</script>
