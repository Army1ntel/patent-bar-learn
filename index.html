  why:"If the specification does not disclose a utility, it cannot teach how to use the invention, so the enablement requirement of 112(a) fails as well.",
  cite:"MPEP 2107.01, 2107.02"},
 {q:"Which of the following is a judicial exception?",
  o:["A method of manufacturing steel","A mathematical formula standing alone","A composition of matter with a new structure","A machine with novel gearing","An article of manufacture with a new shape"],a:1,
  why:"Abstract ideas — including mathematical concepts, certain methods of organizing human activity, and mental processes — are judicial exceptions along with laws of nature and natural phenomena.",
  cite:"MPEP 2106.04(a)"},
 {q:"Claims directed to or encompassing a human organism are:",
  o:["Eligible if the applicant obtains ethics approval","Eligible if isolated","Not eligible; no patent may issue on a claim directed to or encompassing a human organism","Eligible only for non-reproductive uses","Handled under 112(a) rather than 101"],a:2,
  why:"Section 33(a) of the AIA bars any patent claim directed to or encompassing a human organism, and this ground is applied along with 101.",
  cite:"AIA Sec. 33(a); MPEP 2105"}
]}
);
MODULES.push(
{id:"replies",track:"III",fig:"3.1",title:"Replies, Deadlines, and Abandonment",
 blurb:"Shortened statutory periods, extensions, complete replies, and getting an application back.",
 teach:[{h:"The clock",p:[
  "Section 133 sets an outer limit of six months for any reply. Within that ceiling the Office sets a [[ssp|shortened statutory period]] — typically three months for an Office action on the merits, one or two months for lesser notices.",
  "An [[ext|extension of time]] under 37 CFR 1.136(a) is available as of right by paying the fee, in one-month increments up to five months, but never beyond the six-month statutory maximum. It can be filed after the fact, along with the reply, as long as it is within six months. Where 1.136(a) is unavailable — for example where the Office expressly prohibits it — an extension must be requested under 1.136(b) with a showing of sufficient cause."]},
  {h:"Complete and bona fide",p:[
   "A reply must be complete and bona fide, addressing every ground of objection and rejection. A reply that is bona fide but incomplete may earn a short new time period from the Office; a reply that is not bona fide does not stop the clock at all, and the application goes [[abandon|abandoned]].",
   "If it does go abandoned, the route back is a [[revival|petition to revive]] under 37 CFR 1.137: the required reply, the petition fee, and a statement that the entire delay from the due date until the petition was unintentional. Note also the mailing rules: a [[certmail|certificate of mailing]] under Rule 8 saves most papers, but a new application needs [[pme|Priority Mail Express]] under Rule 10. And under 37 CFR 1.7 — when a deadline falls on a Saturday, Sunday, or federal holiday within the District of Columbia, it moves to the next succeeding business day."]}],
 qs:[
 {q:"An Office action on the merits sets a three-month shortened statutory period. What is the latest date a reply may be filed with extensions?",
  o:["Three months from the mailing date","Four months from the mailing date","Six months from the mailing date","Twelve months from the mailing date","Six months from the applicant's receipt of the action"],a:2,
  why:"Extensions under 1.136(a) may be purchased in one-month increments, but no extension may take the reply period beyond the six-month statutory maximum measured from the mailing date of the action.",
  cite:"35 U.S.C. 133; 37 CFR 1.136(a); MPEP 710.02(e)"},
 {q:"A reply is filed in the fifth month after a three-month shortened statutory period was set, without any petition or fee for extension. What is the result?",
  o:["The reply is timely because it is within six months","The reply is untimely and the application is abandoned unless a proper extension request and fee are filed","The Office will grant the extension automatically","The applicant must file a reissue","The examiner may waive the fee"],a:1,
  why:"An extension under 1.136(a) may be filed with the reply, but the petition and fee are still required. Without them the reply is untimely and the application is abandoned.",
  cite:"37 CFR 1.136(a); MPEP 710.02(e)"},
 {q:"A reply addresses two of three rejections and says nothing about the third. Which is most correct?",
  o:["It is a complete reply because some rejections were addressed","It may be treated as a bona fide but incomplete reply, and the Office may set a new shortened period to complete it","It is automatically a proper reply if filed within one month","The examiner must issue a final rejection","The application is immediately abandoned with no remedy"],a:1,
  why:"Where a reply appears to be a bona fide attempt to advance the case but is incomplete, the examiner may give a new time period, usually one or two months, to supply the omission.",
  cite:"37 CFR 1.135(c); MPEP 714.03"},
 {q:"A petition to revive an unintentionally abandoned application must include which of the following?",
  o:["The required reply, the petition fee, and a statement that the entire delay was unintentional","A showing of unavoidable delay and the fee","Only the petition fee","A declaration from each inventor explaining the delay","A terminal disclaimer"],a:0,
  why:"Rule 137 requires the reply, the fee, a statement that the entire delay from the due date until the filing of a grantable petition was unintentional, and, if requested by the Director, additional information.",
  cite:"37 CFR 1.137(a); MPEP 711.03(c)"},
 {q:"A reply period expires on Saturday, July 4. When is the reply due?",
  o:["Friday, July 3","Saturday, July 4","The next succeeding business day","Monday of the following week regardless of holidays","The period is extended by a full month"],a:2,
  why:"Under 37 CFR 1.7, when the last day falls on a Saturday, Sunday, or federal holiday within the District of Columbia, the action may be taken on the next succeeding business day.",
  cite:"37 CFR 1.7; MPEP 710.05"},
 {q:"Which statement about examiner interviews is most correct?",
  o:["Interviews are prohibited after a final rejection","A complete written statement of the substance of the interview must be made of record, and the applicant is responsible for filing one if the examiner's summary is insufficient","Interview agreements are binding on the Office","An interview substitutes for a written reply to an Office action","Only registered attorneys, not agents, may conduct interviews"],a:1,
  why:"The substance of every interview must be made of record. An interview does not by itself remove the need for a proper written reply, and an interview after final is at the examiner's discretion.",
  cite:"37 CFR 1.133(b); MPEP 713.04"},
 {q:"Which paper may NOT be given the benefit of a certificate of mailing under 37 CFR 1.8?",
  o:["A reply to a non-final Office action","An amendment after final","A notice of appeal","A new patent application filing","A petition for extension of time"],a:3,
  why:"Rule 8 excludes the filing of a national patent application specification and drawings, among other papers. For those, Priority Mail Express under 37 CFR 1.10 is the route to a deposit-date filing date.",
  cite:"37 CFR 1.8(a)(2); MPEP 512"}
]},

{id:"afterfinal",track:"III",fig:"3.3",title:"After Final, RCE, and Appeal",
 blurb:"What the applicant can still do once prosecution closes.",
 teach:[{h:"The narrowing after final",p:[
  "After a [[final|final rejection]], 37 CFR 1.113 limits the applicant to appeal, or to an amendment complying with 37 CFR 1.116. Rule 116 amendments are entered only if they cancel claims, comply with formal objections, present rejected claims in better form for appeal, or place the application in condition for allowance. New claims are not entered as of right, and the examiner's refusal to enter is communicated in an advisory action.",
  "Critically, filing an amendment after final does not extend the period for reply. The clock keeps running from the final rejection, though the Office's advisory action practice may give a limited benefit where the reply was filed within the first two months."]},
  {h:"Two ways forward",p:[
   "An [[rce|RCE]] under 37 CFR 1.114 reopens prosecution: a submission plus the fee, filed before abandonment or the payment of the issue fee. It is not available for provisional applications, for design applications, or for utility or plant applications filed before June 8, 1995. A design applicant instead uses a [[cpa|CPA]] under 37 CFR 1.53(d).",
   "Or you appeal. A notice of appeal is filed within the period for reply, along with the fee. The appeal brief follows within two months of the notice, extendable. The examiner may issue an answer, the appellant may file a reply brief within two months, and an oral hearing requires a separate request and fee. The [[ptab|PTAB]] then decides."]}],
 qs:[
 {q:"Which amendment after final rejection is entitled to entry as a matter of right under 37 CFR 1.116?",
  o:["An amendment adding three new independent claims","An amendment canceling claims or complying with a formal requirement made in the final action","An amendment presenting new arguments only","An amendment adding new matter that clarifies the disclosure","Any amendment filed within two months of the final action"],a:1,
  why:"Rule 116 permits amendments canceling claims, complying with formal requirements, presenting rejected claims in better form for appeal, or placing the application in condition for allowance. New claims are not entered as of right.",
  cite:"37 CFR 1.116; MPEP 714.12, 714.13"},
 {q:"For which of the following is a request for continued examination NOT available?",
  o:["A utility application filed in 2020","A plant application filed in 2018","A design application","A national stage application filed in 2019","A continuation of a utility application"],a:2,
  why:"Rule 114(e) excludes provisional applications, utility or plant applications filed before June 8, 1995, international applications filed before that date, design applications, and patents under reexamination. Design applicants use a CPA instead.",
  cite:"37 CFR 1.114(e); MPEP 706.07(h)"},
 {q:"An RCE requires which of the following?",
  o:["A new oath or declaration","A submission and the required fee, filed prior to abandonment or payment of the issue fee","A petition showing good cause","A terminal disclaimer","Withdrawal of the notice of appeal in every case"],a:1,
  why:"An RCE requires a submission, which may be an information disclosure statement, amendment, new argument, or new evidence, plus the fee, filed before the application is abandoned, the issue fee is paid, or a notice of appeal to a court is filed.",
  cite:"37 CFR 1.114(a); MPEP 706.07(h)"},
 {q:"When must a notice of appeal be filed?",
  o:["Within two months of the final rejection in every case","Within the period for reply to the Office action from which appeal is taken, which may be extended under 1.136(a)","Within six months of the first Office action","Only after an advisory action issues","Any time before the patent issues"],a:1,
  why:"The notice of appeal must be filed within the time period for reply, and that period may be extended under 1.136(a) up to the six-month limit.",
  cite:"37 CFR 41.31; MPEP 1204"},
 {q:"After filing a notice of appeal, when is the appeal brief due?",
  o:["Immediately with the notice","Within one month","Within two months of the date of filing the notice of appeal, extendable under 1.136(a)","Within six months, non-extendable","Only after the examiner's answer"],a:2,
  why:"The appellant must file the brief within two months from the date of filing the notice of appeal, and that period is extendable under 37 CFR 1.136(a).",
  cite:"37 CFR 41.37(a); MPEP 1205"},
 {q:"Does filing an amendment after final rejection extend the period for reply?",
  o:["Yes, by one month automatically","Yes, until the advisory action mails","No; the period continues to run from the mailing date of the final rejection","Yes, but only if the amendment cancels claims","No, but the six-month statutory limit is suspended"],a:2,
  why:"The time period continues to run from the final rejection. Filing after final does not toll it, which is why applicants file early enough to receive an advisory action while options remain.",
  cite:"MPEP 706.07(f), 714.13"},
 {q:"An appellant wishes to be heard orally by the PTAB. Which is required?",
  o:["Nothing; hearings are automatic","A written request filed with the fee within the time set by rule","A petition to the Director","Agreement of the examiner","A reply brief in every case"],a:1,
  why:"An oral hearing occurs only if the appellant files a written request accompanied by the required fee within the period set by 37 CFR 41.47.",
  cite:"37 CFR 41.47; MPEP 1209"},
 {q:"Which is most correct about a continued prosecution application under 37 CFR 1.53(d)?",
  o:["It is available for utility, plant, and design applications","It is available only for design applications","It replaced the RCE for all application types","It may be filed after the patent issues","It requires a new specification"],a:1,
  why:"CPA practice was eliminated for utility and plant applications as of July 14, 2003 and remains available only for design applications.",
  cite:"37 CFR 1.53(d); MPEP 201.06(d)"}
]},

{id:"restriction",track:"III",fig:"3.4",title:"Restriction and Double Patenting",
 blurb:"Independent and distinct inventions, election practice, and terminal disclaimers.",
 teach:[{h:"Restriction",p:[
  "An examiner may issue a [[restriction|restriction requirement]] when two or more independent and distinct inventions are claimed and examining them together would be a serious burden. Both halves are required — distinctness alone is not enough without the burden.",
  "The applicant must elect one invention for examination, and may do so with or without [[traverse|traverse]]. Electing with traverse preserves the right to petition the Director for review; electing without traverse gives it up. Failing to reply at all makes the application abandoned. Non-elected claims are withdrawn, not canceled, and may be rejoined later if the elected claims are allowed and the withdrawn claims depend from or otherwise require all the limitations of an allowed claim."]},
  {h:"Double patenting",p:[
   "Statutory [[odp|double patenting]] under 35 U.S.C. 101 bars two patents on the same invention — identical subject matter. It cannot be cured by a disclaimer.",
   "Nonstatutory, or obviousness-type, double patenting bars a claim that is not patentably distinct from one already claimed. It can be overcome by a [[td|terminal disclaimer]] under 37 CFR 1.321(c), which cuts the later patent's term back to the earlier one's expiration and includes a provision that the patent is enforceable only while the two remain commonly owned. And 35 U.S.C. 121 shields a [[divisional|divisional]] filed as a result of a restriction requirement from double patenting over the parent."]}],
 qs:[
 {q:"A restriction requirement is proper only if the inventions are independent or distinct AND:",
  o:["The claims exceed twenty in number","There would be a serious burden on the examiner if restriction were not required","The applicant is a large entity","The application claims foreign priority","The inventions are in different technology centers"],a:1,
  why:"Both criteria must be satisfied. Even inventions that are independent or distinct may not be restricted if there is no serious burden in examining them together.",
  cite:"35 U.S.C. 121; MPEP 803"},
 {q:"An applicant elects Invention I without traverse. What has the applicant given up?",
  o:["The right to file a divisional","The right to petition the Director for review of the restriction requirement","The right to appeal any rejection of the elected claims","The right to claim benefit under 120","The right to an interview"],a:1,
  why:"Election without traverse waives the right to petition under 37 CFR 1.144 for review of the restriction requirement. The right to file a divisional is unaffected.",
  cite:"MPEP 818.01, 818.02"},
 {q:"Claims to a non-elected invention are:",
  o:["Canceled by the examiner","Withdrawn from consideration, and may be rejoined if the elected claims are allowed and the requirements for rejoinder are met","Rejected under 102","Transferred to a new application automatically","Held abandoned"],a:1,
  why:"Non-elected claims are withdrawn rather than canceled, and rejoinder practice can bring them back where, for example, allowed product claims support the withdrawn process claims.",
  cite:"MPEP 821.04"},
 {q:"Which type of double patenting can be overcome by a terminal disclaimer?",
  o:["Statutory double patenting under 35 U.S.C. 101","Nonstatutory, obviousness-type double patenting","Both types","Neither type","Only double patenting between applications with different assignees"],a:1,
  why:"A terminal disclaimer overcomes nonstatutory double patenting only. Statutory double patenting, which requires identical claimed subject matter, cannot be cured by disclaimer — a claim must be canceled or amended.",
  cite:"37 CFR 1.321(c); MPEP 804.02"},
 {q:"A terminal disclaimer filed to overcome nonstatutory double patenting must include:",
  o:["A statement of unintentional delay","A provision that the patent is enforceable only for the period the patent and the reference patent are commonly owned","A fee equal to the issue fee","Consent of the examiner","An affidavit under 37 CFR 1.132"],a:1,
  why:"Rule 321(c) requires the disclaimer to run with any change of ownership and to include the common-ownership enforceability provision, in addition to disclaiming the terminal part of the term.",
  cite:"37 CFR 1.321(c); MPEP 1490"},
 {q:"An applicant files a divisional in response to a restriction requirement and maintains consonance with the restriction. The examiner rejects the divisional claims for double patenting over the parent patent. Which is most correct?",
  o:["The rejection is proper and requires a terminal disclaimer","35 U.S.C. 121 prohibits use of the parent application or patent as a double patenting reference against the divisional","The applicant must abandon the divisional","The rejection is proper only if the claims are identical","The safe harbor applies only to continuations"],a:1,
  why:"The 121 safe harbor bars the Office from using the original application or its patent as a reference against a divisional filed as a result of the restriction requirement, so long as consonance is maintained.",
  cite:"35 U.S.C. 121; MPEP 804.01"}
]},

{id:"postgrant",track:"III",fig:"3.6",title:"After the Patent Issues",
 blurb:"Reissue, reexamination, corrections, maintenance fees, and PTAB trials.",
 teach:[{h:"Fixing your own patent",p:[
  "[[reissue|Reissue]] under 35 U.S.C. 251 is the tool when a patent is wholly or partly inoperative or invalid through error — a defective specification or drawing, or claiming more or less than the patentee had a right to claim. The original must be surrendered, the reissue oath must identify at least one error being relied on, and no new matter may be added. A reissue that broadens any claim must be applied for within two years of the original grant. [[recapture|Recapture]] limits it further: you cannot get back what you deliberately surrendered to obtain allowance.",
  "For smaller problems, a [[coc|certificate of correction]] handles mistakes: Office mistakes are corrected without fee under 35 U.S.C. 254, and applicant mistakes of a clerical or typographical nature made in good faith are corrected for a fee under 255, provided they do not require re-examination."]},
  {h:"Third parties and the Office",p:[
   "[[reexam|Ex parte reexamination]] may be requested by any person at any time during enforceability, but only on the basis of patents and printed publications, and only if the request raises a [[snq|substantial new question of patentability]]. Claims may be narrowed or added in reexamination, but never broadened.",
   "The [[ptab|PTAB]] trials sit alongside. [[pgr|Post-grant review]] is available only within nine months of issuance of an AIA patent, on nearly any invalidity ground. [[ipr|Inter partes review]] becomes available after that nine-month window closes, and is limited to 102 and 103 grounds based on patents and printed publications.",
   "Finally, utility patents require maintenance fees at three and a half, seven and a half, and eleven and a half years, each with a six-month grace period and surcharge. Design and plant patents require none."]}],
 qs:[
 {q:"A patentee wishes to broaden the claims of a patent that issued 30 months ago. Which is most correct?",
  o:["A broadening reissue may be filed at any time during the term","A broadening reissue application must have been applied for within two years of the grant, so it is now too late","A certificate of correction may be used instead","Ex parte reexamination may be used to broaden the claims","A terminal disclaimer permits broadening"],a:1,
  why:"No reissue enlarging the scope of the claims may be granted unless applied for within two years of the original grant. Claims can never be broadened in reexamination either.",
  cite:"35 U.S.C. 251(d); MPEP 1412.03"},
 {q:"Which of the following may form the basis of a request for ex parte reexamination?",
  o:["Public use more than one year before filing","On-sale activity","Patents and printed publications","Failure to disclose the best mode","Indefiniteness under 112(b)"],a:2,
  why:"Ex parte reexamination is confined to prior art consisting of patents and printed publications. Other grounds must go to a PTAB trial or to court.",
  cite:"35 U.S.C. 301, 302; MPEP 2216"},
 {q:"The threshold the Office applies in deciding whether to order ex parte reexamination is:",
  o:["A reasonable likelihood that the requester will prevail","A substantial new question of patentability","A preponderance of the evidence of invalidity","More likely than not that at least one claim is unpatentable","Clear and convincing evidence"],a:1,
  why:"The substantial new question standard governs ex parte reexamination. The reasonable-likelihood standard belongs to inter partes review, and the more-likely-than-not standard to post-grant review.",
  cite:"35 U.S.C. 303; MPEP 2242"},
 {q:"A typographical error made by the applicant appears in an issued patent. It is minor, was made in good faith, and correcting it does not require re-examination. What is the appropriate remedy?",
  o:["Reissue under 35 U.S.C. 251","A certificate of correction under 35 U.S.C. 255 with the required fee","Ex parte reexamination","A petition under 37 CFR 1.183","Nothing can be done after issuance"],a:1,
  why:"Section 255 covers mistakes of a clerical or typographical nature, or of minor character, made in good faith, where correction does not involve changes requiring re-examination. Office mistakes are corrected under 254 without fee.",
  cite:"35 U.S.C. 254, 255; MPEP 1480, 1481"},
 {q:"When may a third party file a petition for post-grant review?",
  o:["Any time during the patent term","Within nine months of the grant of an AIA patent","After nine months from grant","Only after an infringement suit is filed","Only during ex parte reexamination"],a:1,
  why:"PGR is available only within the nine-month window after issuance of a patent subject to the first-inventor-to-file provisions. IPR becomes available after that window, or after termination of a PGR.",
  cite:"35 U.S.C. 321(c); MPEP 2801"},
 {q:"Maintenance fees for a utility patent are due at:",
  o:["4, 8, and 12 years from filing","3.5, 7.5, and 11.5 years from grant, each with a six-month grace period and surcharge","Annually from grant","Once, at 5 years from grant","5, 10, and 15 years from the earliest priority date"],a:1,
  why:"Utility patent maintenance fees are due at three and a half, seven and a half, and eleven and a half years from the date of grant, payable without surcharge in the six months preceding each date and with a surcharge in the six-month grace period after. Design and plant patents require none.",
  cite:"35 U.S.C. 41(b); 37 CFR 1.362; MPEP 2506"},
 {q:"Which statement about a reissue oath or declaration is most correct?",
  o:["It must state that the error arose without any deceptive intention","It must identify at least one error being relied upon as the basis for reissue","It must be signed by every assignee","It must include a terminal disclaimer","It is not required if the reissue only narrows the claims"],a:1,
  why:"The AIA removed the deceptive-intent requirement. The reissue oath must still identify at least one error upon which reissue is based.",
  cite:"37 CFR 1.175(a); MPEP 1414"}
]},

{id:"pct",track:"III",fig:"3.8",title:"PCT and Filing Abroad",
 blurb:"The international route, the 30-month national stage, and the foreign filing license.",
 teach:[{h:"One filing, many countries",p:[
  "A [[pct|PCT]] international application is filed with a receiving office and designates all contracting states. An [[isa|International Searching Authority]] issues an international search report and a written opinion on novelty, inventive step, and industrial applicability. The application publishes at eighteen months from the priority date.",
  "Chapter II is optional: a demand for international preliminary examination must be filed within three months of the transmittal of the search report and written opinion, or twenty-two months from the priority date, whichever expires later. The national stage under 35 U.S.C. 371 is entered by thirty months from the priority date, and that is the deadline that matters most in practice."]},
  {h:"Filing abroad from the United States",p:[
   "An invention made in the United States may not be filed abroad without a [[ffl|foreign filing license]]. In most cases the license is granted automatically and appears on the filing receipt. If it is not, the applicant may petition for a license, or simply wait six months from the U.S. filing date, after which foreign filing is permitted unless a secrecy order has issued. Filing abroad without a license can forfeit the U.S. patent right, though a retroactive license may be sought where the failure was through error."]}],
 qs:[
 {q:"By when must the national stage under 35 U.S.C. 371 ordinarily be entered in the United States?",
  o:["Twelve months from the priority date","Eighteen months from the priority date","Twenty months from the priority date","Thirty months from the priority date","Thirty-six months from the international filing date"],a:3,
  why:"The national stage is entered at thirty months from the priority date, which for U.S. purposes applies whether or not a Chapter II demand was filed.",
  cite:"35 U.S.C. 371(b), (c); MPEP 1893.01"},
 {q:"An international application publishes at:",
  o:["Twelve months from the international filing date","Eighteen months from the priority date","Thirty months from the priority date","On grant only","At the applicant's election only"],a:1,
  why:"International publication occurs promptly after the expiration of eighteen months from the priority date.",
  cite:"PCT Article 21; MPEP 1857"},
 {q:"An inventor made an invention in the United States and wants to file first in Japan. Which is most correct?",
  o:["No license is needed if the inventor is a Japanese national","A foreign filing license is required, or the applicant must wait six months from a U.S. filing with no secrecy order","Only a notice to the Office is needed","A license is required only for defense-related subject matter","The applicant must file in the United States first in all cases"],a:1,
  why:"Section 184 prohibits filing abroad an invention made in the United States without a license, unless six months have elapsed since a U.S. application was filed and no secrecy order has issued.",
  cite:"35 U.S.C. 184; MPEP 140"},
 {q:"A demand for international preliminary examination under Chapter II must be filed by:",
  o:["Three months from the international filing date","Three months from transmittal of the search report and written opinion, or twenty-two months from the priority date, whichever expires later","Nine months from the priority date","Thirty months from the priority date","Any time before national stage entry"],a:1,
  why:"That two-part deadline governs the Chapter II demand. Missing it does not bar national stage entry in the United States, which remains at thirty months.",
  cite:"PCT Rule 54bis; MPEP 1864"},
 {q:"The International Searching Authority issues which of the following along with the international search report?",
  o:["A binding determination of patentability","A written opinion on novelty, inventive step, and industrial applicability","A notice of allowance","A restriction requirement","A certificate of correction"],a:1,
  why:"The ISA issues a written opinion addressing those three criteria. It is not binding on any designated office.",
  cite:"PCT Rule 43bis; MPEP 1845"},
 {q:"An applicant filed abroad without a required foreign filing license, through error. Which is most correct?",
  o:["The U.S. patent right is irretrievably forfeited","A retroactive license may be requested under 37 CFR 5.25 where the filing was through error","The applicant must abandon the U.S. application","The Office will issue a secrecy order","A certificate of correction cures the defect"],a:1,
  why:"A petition for a retroactive license may be granted where the foreign filing was through error, accompanied by the required showing and fee.",
  cite:"37 CFR 5.25; MPEP 140"}
]}
);
Object.assign(GLOSSARY,{
 preaia:{t:"pre-AIA",d:"The first-to-invent law that governs any application whose claims all have an effective filing date before March 16, 2013, and the patents issuing from them. Prior art turns on the date of invention, not the filing date, and the geographic limits still apply.",c:"MPEP 2131 et seq."},
 swear:{t:"swearing behind",d:"An affidavit or declaration under 37 CFR 1.131 establishing that the inventor completed the invention before the effective date of a pre-AIA 102(a) or 102(e) reference. It cannot be used against a 102(b) statutory bar, and it is unavailable where the reference claims the same invention.",c:"37 CFR 1.131; MPEP 715"},
 aff132:{t:"1.132 declaration",d:"Evidence traversing a rejection — unexpected results, commercial success, evidence of nonobviousness, or rebuttal of an examiner's factual assertion. Distinct from a 1.131 declaration, which goes to dates.",c:"37 CFR 1.132; MPEP 716"},
 supp:{t:"abandoned, suppressed, or concealed",d:"Under pre-AIA 102(g), a prior inventor loses the benefit of an earlier invention date if the invention was abandoned, suppressed, or concealed rather than diligently brought to the public.",c:"MPEP 2138.03"},
 rtp:{t:"reduction to practice",d:"Actual reduction to practice means building and testing the invention so it works for its intended purpose; constructive reduction to practice is the filing of an application that satisfies 112(a).",c:"MPEP 2138.05"},
 conception:{t:"conception",d:"The formation in the inventor's mind of a definite and permanent idea of the complete and operative invention. Inventorship turns on conception, not on who built it.",c:"MPEP 2138.04"},
 derivation:{t:"derivation proceeding",d:"An AIA proceeding before the PTAB to determine whether an earlier-filing applicant derived the invention from the petitioner. It replaced interference practice for AIA applications.",c:"35 U.S.C. 135; MPEP 2310"},
 small:{t:"small entity",d:"An independent inventor, a small business concern of fewer than 500 employees, or a nonprofit organization — none of which has assigned or licensed rights to a party that would not qualify. Status is claimed by a written assertion or by paying a small entity fee.",c:"37 CFR 1.27; MPEP 509.02"},
 micro:{t:"micro entity",d:"A small entity that additionally meets the gross income limit, has not been named on more than four previously filed applications, and has no obligation to assign to an over-limit entity — or qualifies through an institution of higher education.",c:"37 CFR 1.29; MPEP 509.04"},
 pet181:{t:"petition under 1.181",d:"Invokes the supervisory authority of the Director over an examiner's action that is not appealable — for instance, refusal to enter an amendment or a restriction requirement. Generally no fee, and generally due within two months of the action.",c:"37 CFR 1.181; MPEP 1002"},
 pet183:{t:"petition under 1.183",d:"Asks the Director to suspend or waive a rule of the Office. It requires an extraordinary situation where justice requires the waiver, plus the fee — and it can never waive a statutory requirement.",c:"37 CFR 1.183; MPEP 1002.02(b)"},
 assign:{t:"assignment",d:"A transfer of the entire right, title, and interest in a patent or application. It must be in writing. Recording with the Office is not required for validity, but it protects against a later purchaser.",c:"35 U.S.C. 261; 37 CFR 3.11; MPEP 301"},
 bfp:{t:"subsequent purchaser",d:"An assignment is void against a later purchaser for valuable consideration without notice unless it is recorded within three months of its date or before the later purchase.",c:"35 U.S.C. 261; MPEP 302"},
 s373:{t:"3.73 statement",d:"The statement by which an assignee establishes its right to take action in an application — identifying the chain of title from the inventor to the assignee, with documents recorded or submitted.",c:"37 CFR 3.73(c); MPEP 325"},
 jointinv:{t:"joint inventors",d:"Two or more people who contributed to the conception of at least one claim. They need not have worked together physically, contributed equally, or contributed to every claim. Absent agreement, each may exploit the whole patent without accounting to the others.",c:"35 U.S.C. 116, 262; MPEP 2137.01"},
 conduct:{t:"USPTO Rules of Professional Conduct",d:"The ethics rules binding every practitioner, at 37 CFR Part 11 Subpart D — competence, diligence, communication, confidentiality, conflicts, fees, and candor. They are modeled on the ABA Model Rules.",c:"37 CFR 11.100 et seq."},
 grievance:{t:"grievance",d:"A written submission to the OED Director alleging practitioner misconduct. A disciplinary proceeding must be commenced within one year after the date the misconduct is made known to a USPTO officer or employee, and within ten years after the misconduct occurred.",c:"35 U.S.C. 32; 37 CFR 11.34(d)"},
 comprising:{t:"transitional phrase",d:"The word joining the preamble to the body of a claim. 'Comprising' is open — additional elements are allowed. 'Consisting of' is closed — nothing beyond the recited elements and their unavoidable impurities. 'Consisting essentially of' allows only additions that do not materially affect the basic and novel characteristics.",c:"MPEP 2111.03"},
 markush:{t:"Markush group",d:"A claim reciting alternatives as a closed group: 'selected from the group consisting of A, B, and C.' Proper if the members share a common use and a substantial structural feature, or all belong to a recognized class.",c:"MPEP 2117, 2173.05(h)"},
 jepson:{t:"Jepson claim",d:"A claim whose preamble describes the conventional elements, followed by 'wherein the improvement comprises.' The preamble is treated as an admission of prior art.",c:"37 CFR 1.75(e); MPEP 2129"},
 pbp:{t:"product-by-process claim",d:"A claim to a product defined by how it is made. Patentability is determined by the product itself; if the product is the same as the prior art product, the claim is unpatentable even though the prior art was made a different way.",c:"MPEP 2113"},
 bri:{t:"broadest reasonable interpretation",d:"During examination, claims are given their broadest reasonable interpretation consistent with the specification as a person of ordinary skill would read it. Limitations from the specification are not read into the claims.",c:"MPEP 2111"},
 multdep:{t:"multiple dependent claim",d:"A claim referring back to more than one previous claim in the alternative. It may not serve as a basis for another multiple dependent claim, it must refer in the alternative only, and it carries a separate fee and is counted as the number of claims it references.",c:"35 U.S.C. 112(e); 37 CFR 1.75(c); MPEP 608.01(n)"},
 status:{t:"status identifier",d:"The parenthetical after each claim number in an amendment — original, currently amended, canceled, withdrawn, previously presented, new, or not entered. Every claim ever presented must be listed with one.",c:"37 CFR 1.121(c); MPEP 714"},
 subspec:{t:"substitute specification",d:"A complete rewritten specification, permitted by way of amendment if it contains no new matter. It must be accompanied by a statement that it adds no new matter and by a marked-up copy showing the changes.",c:"37 CFR 1.125; MPEP 608.01(q)"},
 prelim:{t:"preliminary amendment",d:"An amendment filed before the Office issues a first action. One filed on the filing date of the application is treated as part of the original disclosure.",c:"37 CFR 1.115; MPEP 714.01(e)"},
 pubgrant:{t:"pre-grant publication",d:"Applications are published promptly after eighteen months from the earliest filing date for which benefit is sought, unless a proper nonpublication request is in effect.",c:"35 U.S.C. 122(b); 37 CFR 1.211; MPEP 1120"},
 nonpub:{t:"nonpublication request",d:"A certification, made at the time of filing, that the invention has not been and will not be the subject of an application filed abroad or under a multilateral agreement requiring publication. If the applicant later files abroad, the Office must be notified within 45 days or the application is abandoned.",c:"35 U.S.C. 122(b)(2)(B); 37 CFR 1.213"},
 presub:{t:"preissuance submission",d:"A third party's submission of printed publications with a concise description of relevance, filed before the earlier of a notice of allowance or the later of six months after publication or the first rejection.",c:"35 U.S.C. 122(e); 37 CFR 1.290; MPEP 1134"},
 protest:{t:"protest",d:"A third party's submission of information against a pending application, which must be filed before publication or the mailing of a notice of allowance, whichever comes first, unless the applicant consents.",c:"37 CFR 1.291; MPEP 1901"},
 pta:{t:"patent term adjustment",d:"Day-for-day restoration of term lost to Office delay — missed examination deadlines, pendency beyond three years, and delays from appeals, interferences, or secrecy orders — reduced by the applicant's own failure to engage in reasonable efforts to conclude prosecution.",c:"35 U.S.C. 154(b); 37 CFR 1.702-1.705; MPEP 2730"},
 pte:{t:"patent term extension",d:"Extension for time lost to regulatory review of a product such as a drug or medical device. Limited to five years, and the total remaining term after approval may not exceed fourteen years.",c:"35 U.S.C. 156; MPEP 2750"},
 ordobs:{t:"ordinary observer test",d:"The test for design patent anticipation and infringement: whether an ordinary observer, giving the attention a purchaser usually gives, would find the two designs substantially the same.",c:"MPEP 1504.02"},
 broken:{t:"broken lines",d:"In a design patent drawing, broken lines show environment or unclaimed portions of the article. Solid lines define the claimed design.",c:"37 CFR 1.152; MPEP 1503.02"},
 asexual:{t:"asexual reproduction",d:"Propagation of a plant without seeds — by cutting, grafting, budding, or tissue culture — so that the offspring is genetically identical. It is a prerequisite for a plant patent.",c:"35 U.S.C. 161; MPEP 1601"}
});

MODULES.push(
{id:"preaia",track:"II",fig:"2.4",title:"Pre-AIA 102 and Swearing Behind",
 blurb:"First-to-invent prior art, the statutory bars, and the 1.131 and 1.132 declarations.",
 teach:[{h:"Why this still matters",p:[
  "[[preaia|Pre-AIA]] law governs any application in which every claim has an [[efd|effective filing date]] before March 16, 2013, and every patent that issued from one. Exam fact patterns dated in the 2000s are common, and the analysis is completely different from the [[aia|AIA]]: prior art is measured against the date of invention, geography matters again, and the applicant can sometimes remove a reference by proving an earlier invention date.",
  "The subsections divide into two families. Sections 102(a), (e), (f), and (g) are loss-of-right provisions measured against the applicant's invention date. Section 102(b) and (d) are statutory bars measured against the U.S. filing date, and no proof of earlier invention can defeat them."]},
  {h:"The critical dates",p:[
   "Section 102(a): known or used by others in this country, or patented or described in a printed publication anywhere, before the applicant's invention. Section 102(b): patented or published anywhere, or in public use or on sale in this country, more than one year before the U.S. filing date — the one-year grace period runs backward from filing, and even the inventor's own activity triggers it. Section 102(e): a U.S. patent or published application filed by another before the applicant's invention. Section 102(f): the applicant did not himself invent it. Section 102(g): another inventor made it first in this country and did not [[supp|abandon, suppress, or conceal]] it — the province of interference practice, which the AIA replaced with the [[derivation|derivation proceeding]].",
   "[[swear|Swearing behind]] under 37 CFR 1.131 removes a 102(a) or 102(e) reference by declaring facts showing [[conception|conception]] before the reference date coupled with diligence to a [[rtp|reduction to practice]], or an actual reduction to practice before that date. It cannot touch a 102(b) bar, and it is unavailable where the reference claims the same patentable invention — that goes to interference. A [[aff132|1.132 declaration]] is the different tool: evidence rebutting the merits, such as unexpected results."]}],
 qs:[
 {q:"A printed publication describing the invention appeared 14 months before the applicant's U.S. filing date in a pre-AIA application. The applicant can prove conception and reduction to practice two years before the publication. Which is most correct?",
  o:["A 1.131 declaration removes the reference","The reference is a statutory bar under pre-AIA 102(b) and cannot be sworn behind","The reference is available only under 103","The reference is removed because the applicant invented first","A terminal disclaimer overcomes the rejection"],a:1,
  why:"Publication more than one year before the U.S. filing date is a statutory bar under pre-AIA 102(b). Proof of an earlier invention date is irrelevant to a statutory bar.",
  cite:"Pre-AIA 35 U.S.C. 102(b); MPEP 2133, 715.05"},
 {q:"Under pre-AIA 102(a), which activity by another does NOT qualify as prior art?",
  o:["A printed publication in Germany before the applicant's invention","A U.S. patent issued before the applicant's invention","Knowledge or use in the United States before the applicant's invention","Public use in France before the applicant's invention, never published","A published article in Japan before the applicant's invention"],a:3,
  why:"Under pre-AIA 102(a), knowledge or use must be in this country, while patents and printed publications count from anywhere. Foreign public use alone is not 102(a) prior art — a distinction the AIA erased.",
  cite:"Pre-AIA 35 U.S.C. 102(a); MPEP 2132"},
 {q:"A 37 CFR 1.131 declaration may be used to overcome which rejection?",
  o:["A pre-AIA 102(b) rejection based on a publication 18 months before filing","A pre-AIA 102(e) rejection where the reference does not claim the same patentable invention","A rejection under 112(b)","A double patenting rejection","A rejection where the reference is a statutory bar under 102(d)"],a:1,
  why:"Rule 131 antedates a 102(a) or 102(e) reference. It has no application to statutory bars, to 112 rejections, or to double patenting, and it is unavailable where the reference claims the same patentable invention.",
  cite:"37 CFR 1.131(a); MPEP 715"},
 {q:"To antedate a reference under 37 CFR 1.131, the applicant must establish:",
  o:["Only that conception preceded the reference date","Reduction to practice before the reference date, or conception before that date coupled with diligence from just prior to the reference date to a reduction to practice","That the reference is not analogous art","That the invention was commercially successful","That the reference was published without authorization"],a:1,
  why:"The declaration must show either an actual reduction to practice before the effective date of the reference, or conception before that date coupled with due diligence to a subsequent actual or constructive reduction to practice.",
  cite:"37 CFR 1.131(b); MPEP 715.07"},
 {q:"Under pre-AIA 102(g), a prior inventor's earlier invention date is lost if the prior inventor:",
  o:["Filed a foreign application first","Abandoned, suppressed, or concealed the invention","Assigned the invention","Failed to mark products","Did not obtain a patent within one year"],a:1,
  why:"Section 102(g) requires that the prior inventor not have abandoned, suppressed, or concealed the invention. Unreasonable delay in making it public can forfeit the earlier date.",
  cite:"Pre-AIA 35 U.S.C. 102(g); MPEP 2138.03"},
 {q:"Under pre-AIA 102(d), a foreign patent bars a U.S. patent when:",
  o:["The foreign application was filed at any time before the U.S. filing","The foreign application was filed more than twelve months before the U.S. filing AND the foreign patent granted before the U.S. filing date","The foreign patent issued after the U.S. filing date","The foreign application was published","The applicant is a foreign national"],a:1,
  why:"Both conditions are required: the foreign application must have been filed more than twelve months before the U.S. filing, by the applicant or his legal representatives or assigns, and the foreign patent must have actually granted before the U.S. filing date.",
  cite:"Pre-AIA 35 U.S.C. 102(d); MPEP 2135"},
 {q:"Which declaration would an applicant file to submit evidence of unexpected results in response to an obviousness rejection?",
  o:["A declaration under 37 CFR 1.131","A declaration under 37 CFR 1.132","A substitute statement under 37 CFR 1.64","A terminal disclaimer under 37 CFR 1.321","A statement under 37 CFR 3.73(c)"],a:1,
  why:"Rule 132 covers evidence traversing a rejection on the merits, including unexpected results, commercial success, and rebuttal of an examiner's factual assertions. Rule 131 is only about dates.",
  cite:"37 CFR 1.132; MPEP 716"},
 {q:"Under pre-AIA 103(c), which prior art may be disqualified for obviousness purposes by common ownership at the time the invention was made?",
  o:["Prior art under 102(a) only","Prior art under 102(b) only","Prior art under 102(e), (f), and (g)","All prior art under 102","No prior art may be disqualified"],a:2,
  why:"Pre-AIA 103(c) disqualifies subject matter that qualifies as prior art only under 102(e), (f), or (g) when it was commonly owned, or subject to an obligation of assignment to the same person, at the time the invention was made.",
  cite:"Pre-AIA 35 U.S.C. 103(c); MPEP 2154.02(c), 706.02(l)"},
 {q:"A pre-AIA application is rejected over a U.S. patent to another that was filed before the applicant's invention date but issued after the applicant's filing date. This is a rejection under:",
  o:["Pre-AIA 102(a)","Pre-AIA 102(b)","Pre-AIA 102(e)","Pre-AIA 102(d)","Pre-AIA 102(f)"],a:2,
  why:"Section 102(e) makes a U.S. patent or published application prior art as of its own U.S. filing date when that date precedes the applicant's invention, even though it issues later.",
  cite:"Pre-AIA 35 U.S.C. 102(e); MPEP 2136"}
]},

{id:"claims",track:"II",fig:"2.8",title:"Claim Drafting and Construction",
 blurb:"Transitional phrases, Markush and Jepson forms, product-by-process, and how claims are read.",
 teach:[{h:"How the Office reads a claim",p:[
  "During examination a claim gets its [[bri|broadest reasonable interpretation]] in light of the specification, as a person of ordinary skill would understand it. Limitations that appear only in the specification are not imported into the claim — the frequent applicant argument that 'the specification makes clear' rarely wins on its own.",
  "The [[comprising|transitional phrase]] does enormous work. 'Comprising' is open, so a prior art device with extra parts still reads on the claim. 'Consisting of' closes the claim to the recited elements and their unavoidable impurities. 'Consisting essentially of' sits between: additions are allowed only if they do not materially affect the basic and novel characteristics of the invention."]},
  {h:"Special claim forms",p:[
   "A [[markush|Markush group]] recites alternatives in a closed group. A [[jepson|Jepson claim]] states the prior art in the preamble and the improvement after — and that preamble is read as an admission that the recited material is prior art, which is why practitioners use the form sparingly. A [[pbp|product-by-process claim]] is judged on the product: if the prior art product is the same, the different process of making it does not save the claim.",
   "Form rules matter too. A [[multdep|multiple dependent claim]] must refer to the preceding claims in the alternative, may not depend from another multiple dependent claim, and is counted for fee purposes as the number of claims to which it refers. A preamble limits the claim only when it breathes life and meaning into it — for instance when it supplies antecedent basis for a term in the body."]}],
 qs:[
 {q:"A claim recites 'A composition consisting of A and B.' The prior art discloses a composition of A, B, and C, where C is a functional ingredient. Is the claim anticipated?",
  o:["Yes, because the prior art contains A and B","No, because 'consisting of' closes the claim to A and B and their unavoidable impurities","Yes, because C is immaterial","No, unless C is claimed separately","Yes, because transitional phrases are not limiting"],a:1,
  why:"'Consisting of' excludes any element not specified. A prior art composition containing an additional functional ingredient does not anticipate a closed claim.",
  cite:"MPEP 2111.03"},
 {q:"'Consisting essentially of' limits the scope of a claim to:",
  o:["Only the specified materials, with no additions","The specified materials plus anything else","The specified materials and those that do not materially affect the basic and novel characteristics of the invention","Whatever the specification lists as preferred","The same scope as 'comprising'"],a:2,
  why:"It is the intermediate transitional phrase, permitting unlisted ingredients only where they do not materially affect the basic and novel characteristics of the claimed invention.",
  cite:"MPEP 2111.03"},
 {q:"What is the effect of using the Jepson claim format?",
  o:["It broadens the claim","The preamble is treated as an admission that the recited subject matter is prior art","It exempts the claim from 112(b)","It converts the claim to a method claim","It requires a terminal disclaimer"],a:1,
  why:"Under 37 CFR 1.75(e), the preamble of a Jepson claim recites the conventional elements, and the Office treats that recitation as an admission of prior art.",
  cite:"37 CFR 1.75(e); MPEP 2129"},
 {q:"A product-by-process claim recites a widget made by a novel casting process. The prior art discloses an identical widget made by forging. Which is most correct?",
  o:["The claim is patentable because the process differs","The claim is unpatentable because patentability of a product-by-process claim is based on the product itself","The claim must be rejected under 112(b)","The claim should be converted to a method claim by the examiner","The process steps are given full patentable weight"],a:1,
  why:"Determination of patentability is based on the product. Once the examiner shows the product appears to be the same, the burden shifts to the applicant to show a difference.",
  cite:"MPEP 2113"},
 {q:"Which multiple dependent claim is proper?",
  o:["'The device of claims 1 and 2, wherein...'","'The device of any one of claims 1 to 3, wherein...'","'The device of claim 4, which is a multiple dependent claim, wherein...'","'The device of claim 1 or the method of claim 6, wherein...'","'The device of claims 1-3 and 5, wherein...'"],a:1,
  why:"A multiple dependent claim must refer to preceding claims in the alternative only, may not depend from another multiple dependent claim, and should not mix statutory classes in a way that renders it improper.",
  cite:"35 U.S.C. 112(e); 37 CFR 1.75(c); MPEP 608.01(n)"},
 {q:"For fee calculation purposes, a multiple dependent claim is counted as:",
  o:["One claim","Two claims","The number of claims to which it refers","One independent claim","It is not counted"],a:2,
  why:"A multiple dependent claim is counted as the number of claims to which it refers, and any claim depending from it is counted the same way. A separate multiple dependent claim fee also applies.",
  cite:"37 CFR 1.75(c); MPEP 608.01(n)"},
 {q:"When does a claim preamble limit the claim?",
  o:["Always","Never","When it recites structure or breathes life and meaning into the claim, such as by providing antecedent basis for a term in the body","Only in method claims","Only when it uses the word 'comprising'"],a:2,
  why:"Whether a preamble is limiting is decided on the facts of each case, and depends on whether it gives life, meaning, and vitality to the claim rather than merely stating a purpose or intended use.",
  cite:"MPEP 2111.02"},
 {q:"During examination, claims are interpreted according to which standard?",
  o:["The ordinary meaning as construed by a district court","The broadest reasonable interpretation consistent with the specification, as understood by one of ordinary skill","The narrowest interpretation supported by the specification","The interpretation urged by the applicant","The interpretation used in any related litigation"],a:1,
  why:"The Office applies the broadest reasonable interpretation because claims may still be amended. Limitations from the specification are not read into the claims.",
  cite:"MPEP 2111"}
]}
);
MODULES.push(
{id:"fees",track:"I",fig:"1.4",title:"Fees, Entity Status, and Petitions",
 blurb:"Small and micro entity status, and which petition rule fits which problem.",
 teach:[{h:"Entity status",p:[
  "[[small|Small entity]] status is available to an independent inventor, a business concern with fewer than 500 employees counting affiliates, or a nonprofit organization — provided no rights have been assigned, granted, or licensed to anyone who would not themselves qualify. Status is claimed simply by a written assertion or by paying a small entity fee; no form is required.",
  "[[micro|Micro entity]] status adds three more conditions on top of small entity status: the applicant's gross income in the preceding year was below the statutory multiple of the median household income, the applicant has not been named as an inventor on more than four previously filed applications, and the applicant has no obligation to assign to an entity exceeding that income limit. There is a separate route for applicants whose employer is an institution of higher education. Note that provisional applications, foreign applications, and applications assigned to a previous employer do not count toward the four-application limit.",
  "Status must be re-verified when the issue fee and each maintenance fee is paid. A good-faith error in claiming status can be corrected by paying the deficiency; a fraudulent claim is a different matter entirely."]},
  {h:"Choosing the right petition",p:[
   "A [[pet181|petition under 37 CFR 1.181]] invokes the Director's supervisory authority over matters that are not appealable to the PTAB — refusal to enter an amendment, an objection, a holding of abandonment, or a restriction requirement after election with traverse. It generally carries no fee and should be filed within two months of the action.",
   "A petition under 1.182 covers situations not specifically provided for by rule and requires a fee. A [[pet183|petition under 1.183]] asks the Director to suspend or waive a rule, and requires an extraordinary situation where justice requires the waiver, plus a fee. Neither can waive a requirement imposed by statute — only rules of the Office can be suspended.",
   "The dividing line the exam tests constantly: questions of substance, meaning the merits of a rejection, go to the PTAB on appeal. Questions of procedure go to the Director on petition."]}],
 qs:[
 {q:"An applicant is an independent inventor who has exclusively licensed the invention to a corporation with 3,000 employees. Which is most correct?",
  o:["Small entity status is available because the inventor is an individual","Small entity status is not available, because rights have been licensed to a party that would not itself qualify","Small entity status is available if the license is not recorded","Micro entity status is available instead","Status depends only on the number of the inventor's own employees"],a:1,
  why:"Small entity status requires that no rights have been assigned, granted, conveyed, or licensed, and that there is no obligation to do so, to any entity that would not qualify as a small entity.",
  cite:"37 CFR 1.27(a); MPEP 509.02"},
 {q:"Which of the following does NOT count toward the four-application limit for micro entity status?",
  o:["A previously filed U.S. nonprovisional application naming the applicant as inventor","A previously filed provisional application","A previously filed continuation naming the applicant","A previously filed design application naming the applicant","A previously filed plant application naming the applicant"],a:1,
  why:"Provisional applications, international applications for which the national stage fee was not paid, and applications resulting from prior employment obligations are excluded from the count.",
  cite:"37 CFR 1.29(a)(2); MPEP 509.04(a)"},
 {q:"How does an applicant establish small entity status?",
  o:["By filing a notarized affidavit","By a written assertion of entitlement, or by payment of an exact small entity basic filing fee","By petition to the Director with a fee","By recording an assignment","Status is assigned automatically by the Office"],a:1,
  why:"A written assertion signed by the applicant, an assignee, or a practitioner suffices, and paying the exact small entity basic filing fee is itself treated as an assertion.",
  cite:"37 CFR 1.27(c); MPEP 509.03"},
 {q:"An examiner refuses to enter an amendment after final rejection. The proper course is:",
  o:["Appeal to the PTAB, because the refusal is a substantive matter","Petition under 37 CFR 1.181 invoking the supervisory authority of the Director","Petition under 37 CFR 1.183 to waive the rule","File a reissue application","File a protest"],a:1,
  why:"Refusal to enter an amendment is a procedural matter reviewable by petition under Rule 181, not by appeal. The PTAB reviews the merits of rejections, not the examiner's procedural actions.",
  cite:"37 CFR 1.181; MPEP 714.19, 1002.02(c)"},
 {q:"A petition under 37 CFR 1.183 requires which showing?",
  o:["Unavoidable delay","An extraordinary situation where justice requires waiver or suspension of a rule, plus the fee","Good cause and diligence","A substantial new question of patentability","Consent of the examiner"],a:1,
  why:"Rule 183 permits suspension or waiver of a rule of the Office, but only in an extraordinary situation where justice requires, and never as to a requirement of the statute.",
  cite:"37 CFR 1.183; MPEP 1002.02(b)"},
 {q:"Which matter is decided by the PTAB rather than by petition to the Director?",
  o:["A restriction requirement after election with traverse","A holding of abandonment","The propriety of a rejection under 35 U.S.C. 103","Refusal to accord a filing date","An objection to the drawings"],a:2,
  why:"The Board reviews adverse decisions of examiners on the merits — rejections of claims. Everything procedural goes to the Director by petition.",
  cite:"35 U.S.C. 134; MPEP 1002, 1201"},
 {q:"When must entitlement to small entity status be re-verified?",
  o:["Never after the initial assertion","Each time an Office action is answered","When the issue fee is paid and when each maintenance fee is paid","Only if the application is assigned","Annually"],a:2,
  why:"A new determination of status is required when the issue fee is paid and again at each maintenance fee payment. Status otherwise carries forward in the application once asserted.",
  cite:"37 CFR 1.27(g); MPEP 509.02"}
]},

{id:"ownership",track:"I",fig:"1.5",title:"Inventorship, Ownership, and Assignment",
 blurb:"Who is an inventor, who owns the patent, and what recording actually buys you.",
 teach:[{h:"Inventorship",p:[
  "Inventorship turns on [[conception|conception]], not on effort or funding. A technician who builds the prototype under direction is not an inventor; a supervisor who suggests a result without a way to achieve it is not an inventor. [[jointinv|Joint inventors]] need not have worked together physically, need not have contributed equally, and need not have contributed to the subject matter of every claim — contribution to the conception of one claim is enough.",
  "Because claims change during prosecution, inventorship can change with them. Correction under 37 CFR 1.48 is available by request identifying the correct inventors, with the processing fee, and since the AIA it no longer requires any showing about deceptive intent."]},
  {h:"Ownership and recording",p:[
   "An [[assign|assignment]] must be in writing. The Office does not decide ownership disputes, but it does record documents, and recording has one crucial legal effect: under 35 U.S.C. 261, an assignment is void against a later [[bfp|purchaser for value without notice]] unless it is recorded within three months of its date or before that later purchase.",
   "Absent an agreement to the contrary, each joint owner may make, use, offer to sell, and sell the patented invention without the consent of, and without accounting to, the other owners. That default surprises clients constantly.",
   "An assignee that wants to take action in an application must establish its right to do so by a [[s373|3.73 statement]] specifying the chain of title from the inventor, with each document either recorded or submitted."]}],
 qs:[
 {q:"A laboratory technician builds and tests a device exactly as directed by the researcher who conceived it. Who is the inventor?",
  o:["The technician alone","The researcher alone","Both, as joint inventors","Whoever is named first on the application","The employer"],a:1,
  why:"Inventorship rests on conception. One who merely reduces an invention to practice under the direction of another, exercising no inventive skill, is not an inventor.",
  cite:"MPEP 2137.01"},
 {q:"Which is required for two people to be joint inventors under 35 U.S.C. 116?",
  o:["They must have worked together physically","Each must have contributed to the subject matter of every claim","Each must have made a contribution to the conception of at least one claim","They must contribute equally","They must be employed by the same entity"],a:2,
  why:"Section 116 expressly provides that inventors may apply jointly even though they did not work together, did not make the same type or amount of contribution, and did not each contribute to the subject matter of every claim.",
  cite:"35 U.S.C. 116(a); MPEP 2137.01"},
 {q:"An assignment executed January 5 is recorded May 20. On April 1 the assignor sold the same rights to a bona fide purchaser for value without notice, who recorded promptly. What is the result?",
  o:["The January assignment prevails because it was executed first","The January assignment is void against the subsequent purchaser, because it was not recorded within three months or before the subsequent purchase","Both assignments are valid in equal shares","The Office will decide the dispute on petition","The subsequent purchase is void"],a:1,
  why:"Section 261 makes an assignment void against a subsequent purchaser for valuable consideration without notice unless it is recorded within three months of its date or prior to the date of the subsequent purchase.",
  cite:"35 U.S.C. 261; MPEP 302"},
 {q:"Absent any agreement to the contrary, may one joint owner of a patent license it without the consent of the other joint owners?",
  o:["No, unanimous consent is required","No, a majority interest is required","Yes, and without accounting to the other owners","Yes, but the proceeds must be shared equally","Only with permission of the Office"],a:2,
  why:"Section 262 permits each joint owner to make, use, offer to sell, sell, and import the patented invention without the consent of and without accounting to the other owners, absent an agreement otherwise.",
  cite:"35 U.S.C. 262; MPEP 301"},
 {q:"During prosecution, claims to one inventor's contribution are canceled, leaving that person not an inventor of any remaining claim. What should be done?",
  o:["Nothing; original inventorship controls","File a request to correct inventorship under 37 CFR 1.48 with the processing fee","File a reissue application after the patent issues","File a petition under 37 CFR 1.183","File a terminal disclaimer"],a:1,
  why:"Inventorship must reflect the claims as they stand. Rule 48 permits correction on request identifying each inventor by legal name, with the processing fee, without any statement about deceptive intent.",
  cite:"37 CFR 1.48; MPEP 602.01(c)"},
 {q:"An assignee wishes to take action in an application as the applicant. What must it file?",
  o:["Nothing beyond a recorded assignment","A statement under 37 CFR 3.73(c) specifying the chain of title, with each document recorded or submitted","A petition under 37 CFR 1.181","A new oath from each inventor","A power of attorney signed by the inventors"],a:1,
  why:"Recording alone does not establish the right to take action. The assignee must file the 3.73(c) statement establishing ownership.",
  cite:"37 CFR 3.73(c); MPEP 325"},
 {q:"Which statement about recording an assignment with the Office is most correct?",
  o:["Recording is required for the assignment to be valid between the parties","Recording is not required for validity, but the Office will record the document and recording protects against a subsequent purchaser","The Office adjudicates ownership disputes upon recording","Only assignments of issued patents may be recorded","Recording transfers title automatically"],a:1,
  why:"The Office records documents as a ministerial act and does not determine the validity of the document or resolve ownership disputes. The recording matters for the 261 protection against subsequent purchasers.",
  cite:"37 CFR 3.11, 3.54; MPEP 302"}
]},

{id:"ethics",track:"I",fig:"1.6",title:"Professional Conduct and Discipline",
 blurb:"The Part 11 rules — competence, confidentiality, conflicts, fees, and candor.",
 teach:[{h:"Duties to the client",p:[
  "The [[conduct|USPTO Rules of Professional Conduct]] track the ABA Model Rules. A practitioner must provide competent representation, act with reasonable diligence, and keep the client reasonably informed — including promptly informing the client of any decision requiring the client's informed consent.",
  "Confidentiality is broad: a practitioner shall not reveal information relating to the representation unless the client gives informed consent, disclosure is impliedly authorized to carry out the representation, or a narrow exception applies, such as preventing reasonably certain death or substantial bodily harm, or responding to allegations in a proceeding concerning the practitioner's representation.",
  "Fees must be reasonable. A practitioner may not enter a business transaction with a client unless the terms are fair, fully disclosed in writing in understandable terms, the client is advised in writing to seek independent counsel and given a reasonable chance to do so, and the client gives informed written consent."]},
  {h:"Conflicts, candor, and discipline",p:[
   "A concurrent conflict exists when representing one client will be directly adverse to another, or when there is a significant risk that the representation will be materially limited by responsibilities to another client, a former client, a third person, or the practitioner's own interests. Some conflicts can be cured by informed written consent; some cannot.",
   "Toward the Office as a tribunal, a practitioner must not knowingly make a false statement of fact or law, must correct a false statement previously made, and must disclose controlling legal authority known to be directly adverse to the client's position and not disclosed by opposing counsel.",
   "Discipline runs through the [[grievance|OED]]. A disciplinary proceeding must be commenced within one year after the date on which the misconduct is made known to a USPTO officer or employee, and in no event more than ten years after the misconduct occurred."]}],
 qs:[
 {q:"Under 37 CFR 11.106, a practitioner may reveal information relating to the representation when:",
  o:["Any third party requests it","The client gives informed consent, disclosure is impliedly authorized to carry out the representation, or a listed exception applies","The information is embarrassing rather than harmful","The representation has ended","The information concerns an issued patent"],a:1,
  why:"The confidentiality rule is broad and covers all information relating to the representation, subject to informed consent, implied authorization, and the enumerated exceptions.",
  cite:"37 CFR 11.106; MPEP 402"},
 {q:"A practitioner wishes to accept an equity interest in the client's startup in lieu of fees. Which is required?",
  o:["Nothing, since fee arrangements are private","The terms must be fair and reasonable and fully disclosed in writing in understandable terms, the client must be advised in writing to seek independent counsel and given a reasonable opportunity to do so, and the client must give informed consent in a signed writing","Only oral disclosure of the terms","Approval by the OED Director","A written waiver of malpractice liability"],a:1,
  why:"Rule 11.108(a) imposes all three conditions on business transactions with a client and acquisitions of an ownership interest adverse to the client.",
  cite:"37 CFR 11.108(a)"},
 {q:"A disciplinary proceeding against a practitioner must be commenced within:",
  o:["Six months after the misconduct occurred","One year after the date the misconduct is made known to a USPTO officer or employee, and no more than ten years after the misconduct","Three years after the client complains","Five years after the misconduct occurred, in all cases","There is no limitations period"],a:1,
  why:"Section 32 and Rule 11.34(d) impose both the one-year discovery limit and the ten-year outer limit.",
  cite:"35 U.S.C. 32; 37 CFR 11.34(d)"},
 {q:"Which is a practitioner's duty of candor toward the Office as a tribunal?",
  o:["To disclose all prior art discovered in any client's matter","To disclose legal authority in the controlling jurisdiction known to be directly adverse to the client's position and not disclosed by opposing counsel","To reveal client confidences on request of an examiner","To avoid all ex parte communications","To report other practitioners' fee arrangements"],a:1,
  why:"Rule 11.303 requires disclosure of directly adverse controlling authority, correction of false statements previously made, and refraining from knowingly false statements of fact or law.",
  cite:"37 CFR 11.303"},
 {q:"A concurrent conflict of interest exists under 37 CFR 11.107 when:",
  o:["Two clients work in the same industry","The representation of one client will be directly adverse to another client, or there is a significant risk the representation will be materially limited by responsibilities to another client, a former client, a third person, or the practitioner's own interests","The practitioner has previously met the opposing party","A client cannot pay the full fee","The clients are in different technology areas"],a:1,
  why:"Rule 11.107(a) defines the concurrent conflict in those two ways. Some conflicts may be waived by informed consent confirmed in writing; some may not.",
  cite:"37 CFR 11.107"},
 {q:"A registered practitioner discovers that a client intends to submit a fabricated test result in a 1.132 declaration. What must the practitioner do?",
  o:["File it, because the client directs the representation","Refuse to offer the evidence, and if already offered, take reasonable remedial measures including, if necessary, disclosure to the Office","File it with a disclaimer","Withdraw silently and take no other action","Report the client to the OED before doing anything else"],a:1,
  why:"A practitioner shall not offer evidence known to be false, and must take reasonable remedial measures if the practitioner comes to know of the falsity of material evidence already offered.",
  cite:"37 CFR 11.303(a)(3), (b)"},
 {q:"Which of the following is professional misconduct under 37 CFR 11.804?",
  o:["Charging a contingent fee in a permissible matter","Engaging in conduct involving dishonesty, fraud, deceit, or misrepresentation","Declining a case outside the practitioner's technical field","Withdrawing after giving the client reasonable notice","Advertising services truthfully"],a:1,
  why:"Rule 11.804 lists conduct involving dishonesty, fraud, deceit, or misrepresentation, along with violating the rules through another's acts and conduct prejudicial to the administration of justice.",
  cite:"37 CFR 11.804"},
 {q:"A practitioner must promptly inform the client of:",
  o:["Only final Office actions","Any decision or circumstance requiring the client's informed consent","Only matters affecting the fee","Nothing until the case concludes","Only matters the client asks about"],a:1,
  why:"Rule 11.104 requires prompt communication of any decision or circumstance requiring informed consent, reasonable consultation about means, and keeping the client reasonably informed about status.",
  cite:"37 CFR 11.104"}
]}
);
MODULES.push(
{id:"amendments",track:"III",fig:"3.2",title:"Amendment Practice and Formalities",
 blurb:"Rule 121 mechanics, drawings, the abstract, and the parts of a specification.",
 teach:[{h:"Rule 121 mechanics",p:[
  "Every amendment to the claims must present a complete listing of all claims ever presented, each with its [[status|status identifier]] in parentheses: original, currently amended, canceled, withdrawn, previously presented, new, or not entered. A claim marked canceled or not entered needs no claim text. Only claims marked 'currently amended' or 'new' show markings — underlining for added text, strikethrough or double brackets for deleted text.",
  "Specification amendments are made by replacing an entire paragraph, replacing a section, or submitting a [[subspec|substitute specification]]. A substitute specification requires a statement that it contains no [[newmatter|new matter]] plus a marked-up copy showing the changes. A [[prelim|preliminary amendment]] filed on the same day as the application is treated as part of the original disclosure."]},
  {h:"Drawings and the shape of the document",p:[
   "Drawings are amended by submitting a replacement sheet labeled 'Replacement Sheet' containing all figures from that sheet, with the changes explained in the remarks. New drawings may not introduce new matter.",
   "The abstract goes on a separate sheet, in a single paragraph, and should not exceed 150 words. Section 1.77 sets the preferred arrangement of the specification — title, cross-reference to related applications, statement regarding federally sponsored research, background, summary, brief description of the drawings, detailed description, claims, abstract, sequence listing — and examiners will object when parts are missing or out of order."]}],
 qs:[
 {q:"In an amendment, which claims must appear in the claim listing?",
  o:["Only the claims being amended","Only the pending claims","All claims ever presented in the application, each with a status identifier","Only new claims","Only independent claims"],a:2,
  why:"Rule 121(c) requires a complete listing of all claims ever presented, including canceled and withdrawn claims, each with the appropriate status identifier.",
  cite:"37 CFR 1.121(c); MPEP 714"},
 {q:"Which status identifier requires that the claim text be presented with markings showing the changes?",
  o:["Canceled","Withdrawn","Previously presented","Currently amended","Not entered"],a:3,
  why:"Only claims labeled 'currently amended' show markings. New claims are presented in clean form without markings, and canceled or not-entered claims need no text.",
  cite:"37 CFR 1.121(c)(2); MPEP 714"},
 {q:"A substitute specification must be accompanied by:",
  o:["A petition and fee","A statement that it contains no new matter and a marked-up copy showing all changes","An oath from each inventor","A terminal disclaimer","Nothing further"],a:1,
  why:"Rule 125 permits a substitute specification if it contains no new matter, and requires both the statement to that effect and a marked-up version showing all changes relative to the immediate prior version.",
  cite:"37 CFR 1.125; MPEP 608.01(q)"},
 {q:"How are drawing corrections submitted?",
  o:["By marking up the original drawings in red ink","By submitting a replacement sheet labeled 'Replacement Sheet' containing all figures appearing on that sheet","By describing the change in the remarks only","By petition under 37 CFR 1.181","By filing a continuation"],a:1,
  why:"Amended drawings are submitted as replacement sheets so labeled, including all figures from the original sheet even if only one is amended, and the changes are explained in the remarks or a separate paper.",
  cite:"37 CFR 1.121(d); MPEP 608.02(h)"},
 {q:"Which is correct regarding the abstract of the disclosure?",
  o:["It must appear at the beginning of the specification","It must be a single paragraph on a separate sheet, and should not exceed 150 words","It may be used to interpret the claims","It must be at least 250 words","It is optional"],a:1,
  why:"Rule 72(b) requires a single-paragraph abstract commencing on a separate sheet, and provides that it should not exceed 150 words.",
  cite:"37 CFR 1.72(b); MPEP 608.01(b)"},
 {q:"A preliminary amendment is filed on the same day as the application. What is its status?",
  o:["It is treated as new matter","It is treated as part of the original disclosure","It is refused entry","It requires a petition and fee","It converts the application to a CIP"],a:1,
  why:"A preliminary amendment present on the filing date is part of the original disclosure. One filed later must not introduce new matter, and may be denied entry in certain circumstances.",
  cite:"37 CFR 1.115; MPEP 714.01(e)"},
 {q:"An applicant submits an amendment to the claims that does not comply with 37 CFR 1.121. What is the likely consequence?",
  o:["The amendment is entered as filed","The amendment may be held non-compliant, and the applicant will be notified and given a time period to submit a compliant amendment","The application is immediately abandoned","The examiner rewrites the claims","The amendment is treated as a petition"],a:1,
  why:"A non-compliant amendment is not entered; the Office notifies the applicant and sets a time period, often non-extendable, in which to file a compliant amendment.",
  cite:"37 CFR 1.121(h); MPEP 714.03"}
]},
