<style>
:root{
  --paper:#F7F7F4; --card:#FFFFFF; --ink:#15171C; --ink-2:#4A4F5A;
  --rule:#D6D6CE; --rule-2:#EAEAE4;
  --blue:#1B3A6B; --blue-soft:#E7ECF4;
  --green:#2F6B4F; --green-soft:#E6F0EA;
  --red:#A32C2B; --red-soft:#F7E9E8;
  --gold:#B4892C; --gold-soft:#F7F0DE;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad) 96px}

/* ---------- masthead ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--blue);color:#F7F7F4;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  border-bottom:3px double rgba(247,247,244,.5);
}
.mast{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mast h1{
  font-family:var(--serif);font-size:17px;font-weight:normal;margin:0;
  letter-spacing:.06em;flex:1;
}
.mast h1 small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;opacity:.72;margin-top:2px}
.brandmark{
  font-family:var(--serif);font-size:19px;line-height:1;flex:none;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(247,247,244,.55);border-radius:3px;color:#F7F7F4;padding-bottom:2px;
}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:rgba(247,247,244,.14);padding:5px 9px;border-radius:3px;white-space:nowrap}
.iconbtn{background:none;border:1px solid rgba(247,247,244,.4);border-radius:3px;width:32px;height:32px;line-height:1;padding:0;font-size:15px;color:#F7F7F4}

/* ---------- home ---------- */
.tracklbl{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink-2);
  margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline;
}
.mod{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-radius:4px;padding:13px 14px;margin-bottom:8px;position:relative;
}
.mod:active{background:#FBFBF8}
.mod .top{display:flex;align-items:baseline;gap:9px}
.mod .fig{font-family:var(--mono);font-size:11px;color:var(--blue);letter-spacing:.04em;flex:none;padding-top:2px}
.mod .name{font-family:var(--serif);font-size:17px;line-height:1.25;flex:1}
.mod .blurb{font-size:13.5px;color:var(--ink-2);margin:5px 0 9px;line-height:1.45}
.bar{height:4px;background:var(--rule-2);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.m{background:var(--gold)}
.bar i.s{background:var(--blue);opacity:.45}
.mod .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:6px;letter-spacing:.04em}
.seal{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:2px 5px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.qbtn{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:12px 10px;text-align:left}
.qbtn b{display:block;font-family:var(--serif);font-size:15px;font-weight:normal}
.qbtn span{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.08em}
.qbtn:disabled{opacity:.42}

.hero{border-bottom:1px solid var(--rule);padding:22px 0 18px;margin-bottom:4px}
.hero .kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--blue)}
.hero h2{font-family:var(--serif);font-weight:normal;font-size:26px;line-height:1.2;margin:8px 0 10px}
.hero p{font-size:14.5px;color:var(--ink-2);margin:0}
.statrow{display:flex;gap:20px;margin-top:16px}
.statrow div{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-2)}
.statrow b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:0}

/* ---------- lesson ---------- */
.crumb{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.crumb .x{background:none;border:none;padding:0 6px 0 0;font-size:20px;color:var(--ink-2);line-height:1}
.crumb .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:3px;background:var(--rule-2);border-radius:2px;margin-bottom:20px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s ease}

.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:18px 17px;margin-bottom:14px}
.card.teach{border-left:3px solid var(--blue)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--blue);margin-bottom:9px}
.card h3{font-family:var(--serif);font-weight:normal;font-size:21px;line-height:1.25;margin:0 0 12px}
.card p{margin:0 0 12px;font-size:16px;line-height:1.62}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 12px;padding-left:20px}
.card li{margin-bottom:7px;line-height:1.55}

.qtext{font-size:17px;line-height:1.6;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:12px 13px;line-height:1.48;font-size:15.5px;
}
.opt .ltr{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:none;padding-top:2px;min-width:14px}
.opt.pick{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .ltr{color:var(--green)}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt.no .ltr{color:var(--red)}
.opt:disabled{cursor:default;opacity:1}

.fb{border-radius:4px;padding:14px 15px;margin-top:14px;border:1px solid}
.fb.ok{border-color:var(--green);background:var(--green-soft)}
.fb.no{border-color:var(--red);background:var(--red-soft)}
.fb .hd{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;margin-bottom:8px}
.fb.ok .hd{color:var(--green)}
.fb.no .hd{color:var(--red)}
.fb p{margin:0 0 10px;font-size:15px;line-height:1.58}
.fb p:last-child{margin-bottom:0}
.cite{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.02em;border-top:1px dotted var(--rule);padding-top:8px;margin-top:10px}

.cta{
  display:block;width:100%;background:var(--blue);color:#F7F7F4;border:none;border-radius:4px;
  padding:15px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;margin-top:14px;
}
.cta.ghost{background:none;color:var(--blue);border:1px solid var(--blue)}
.cta:active{opacity:.85}

/* ---------- reference numerals (signature) ---------- */
.term{
  background:none;border:none;padding:0;margin:0;font:inherit;color:var(--blue);
  border-bottom:1px dashed var(--blue);line-height:inherit;
}
.term sup{
  font-family:var(--mono);font-size:9px;border:1px solid var(--blue);border-radius:50%;
  padding:1px 3px;margin-left:2px;vertical-align:super;line-height:1;
}
.term:active{background:var(--blue-soft)}
code{font-family:var(--mono);font-size:.86em;background:#F1F1EC;padding:1px 4px;border-radius:2px;letter-spacing:-.01em}
b,strong{font-weight:600}

/* ---------- sheets & modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,23,28,.44);z-index:60;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-top:3px double var(--blue);border-radius:10px 10px 0 0;
  padding:18px var(--pad) calc(24px + env(safe-area-inset-bottom));
  max-height:78vh;overflow:auto;display:none;
  max-width:640px;margin:0 auto;
}
.sheet.on{display:block;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .num{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--blue);margin-bottom:6px}
.sheet h4{font-family:var(--serif);font-weight:normal;font-size:21px;margin:0 0 10px}
.sheet p{font-size:15.5px;line-height:1.6;margin:0 0 12px}

.gterm{border-bottom:1px solid var(--rule-2);padding:13px 0}
.gterm b{font-family:var(--serif);font-weight:normal;font-size:17px;display:block;margin-bottom:4px}
.gterm p{font-size:14.5px;color:var(--ink-2);margin:0;line-height:1.55}
.gterm .cite{border:none;padding:0;margin-top:5px}
.gsearch{width:100%;font-family:var(--sans);font-size:16px;padding:11px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--card);margin-bottom:4px}

.colophon{
  border-top:3px double var(--rule);margin-top:18px;padding-top:14px;
  font-family:var(--serif);font-size:14px;color:var(--ink-2);line-height:1.55;
}
.colophon b{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--blue);display:block;margin-bottom:6px;font-weight:normal}
.colophon a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--rule)}
.note{font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--ink-2);letter-spacing:.02em;border-top:1px solid var(--rule);margin-top:34px;padding-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header><div class="mast">
  <div class="brandmark" aria-hidden="true">§</div>

<script>
/* ============ GLOSSARY — clickable reference numerals ============ */
const GLOSSARY={
 mpep:{t:"MPEP",d:"The Manual of Patent Examining Procedure — the USPTO's internal operating manual for examiners. It is not itself law, but it collects and explains the statutes (35 U.S.C.) and rules (37 CFR). The exam is written from it, and it is searchable on the exam computer.",c:"MPEP Foreword"},
 usc:{t:"35 U.S.C.",d:"Title 35 of the United States Code — the patent statutes passed by Congress. This is actual law. Cited as sections, e.g. 35 U.S.C. 102.",c:"MPEP Appendix L"},
 cfr:{t:"37 CFR",d:"Title 37 of the Code of Federal Regulations — the USPTO's own rules, written by the Office under authority Congress gave it. Cited as 'Rule' numbers: 37 CFR 1.56 is often just called Rule 56.",c:"MPEP Appendix R"},
 oed:{t:"OED",d:"Office of Enrollment and Discipline — the USPTO office that decides who may sit for the exam, registers practitioners, and disciplines them afterward.",c:"37 CFR 11.2"},
 practitioner:{t:"practitioner",d:"A registered patent attorney or registered patent agent — someone on the USPTO register who may represent others before the Office in patent matters.",c:"37 CFR 11.1"},
 agent:{t:"patent agent",d:"A registered non-lawyer. May do everything before the USPTO that a patent attorney can do in patent cases — draft, file, prosecute, appeal to the PTAB — but may not practice law generally (no court appearances, no infringement litigation).",c:"37 CFR 11.5(b)(1)"},
 applicant:{t:"applicant",d:"The party who applies for the patent. Since Sept 16, 2012 this can be the inventor or a juristic entity such as an assignee; before that it was always the inventor.",c:"37 CFR 1.42"},
 juristic:{t:"juristic entity",d:"A legal person that is not a human — a corporation, LLC, university, partnership. A juristic entity applicant must act through a registered practitioner; it cannot file papers on its own behalf the way a pro se inventor can.",c:"37 CFR 1.31, 1.33(b)(3)"},
 prose:{t:"pro se",d:"Acting for yourself without a practitioner. An inventor-applicant may prosecute their own application pro se; a juristic entity may not.",c:"37 CFR 1.31"},
 poa:{t:"power of attorney",d:"The document by which an applicant authorizes a practitioner to act for them. Must be signed by the applicant or the assignee that has taken over as applicant under 37 CFR 3.71.",c:"37 CFR 1.32"},
 ssig:{t:"S-signature",d:"An electronic signature typed between two forward slashes, e.g. /John Q. Public/. The signer must personally insert it, and a practitioner must also print or type their name and registration number adjacent to it.",c:"37 CFR 1.4(d)(2)"},
 ads:{t:"ADS",d:"Application Data Sheet — the form that carries bibliographic data: inventors, applicant, correspondence address, and critically the domestic benefit and foreign priority claims. Since Sept 16, 2012 benefit and priority claims must appear in the ADS to be effective.",c:"37 CFR 1.76"},
 ids:{t:"IDS",d:"Information Disclosure Statement — the paper by which an applicant gives the examiner prior art and other material information. It is how the duty of disclosure is satisfied.",c:"37 CFR 1.97, 1.98"},
 duty:{t:"duty of disclosure",d:"The obligation of each individual associated with filing and prosecuting an application to disclose to the Office all information known to that individual to be material to patentability. It is a duty of candor and good faith. There is no duty to search.",c:"37 CFR 1.56"},
 material:{t:"material to patentability",d:"Information is material when it is not cumulative and it either establishes a prima facie case of unpatentability by itself or with other info, or it refutes or is inconsistent with a position the applicant is taking.",c:"37 CFR 1.56(b)"},
 provisional:{t:"provisional application",d:"A cheap 12-month placeholder filing. No claims, oath, or IDS required; it is never examined and cannot mature into a patent. Its only job is to establish an earlier effective filing date for a later nonprovisional.",c:"35 U.S.C. 111(b); MPEP 201.04"},
 nonprov:{t:"nonprovisional",d:"A regular utility application under 35 U.S.C. 111(a) that will actually be examined.",c:"MPEP 201.01"},
 efd:{t:"effective filing date",d:"For a claimed invention, the actual filing date of the application — or, if a proper benefit or priority claim exists back to an earlier application disclosing that invention, the filing date of that earlier application. This date decides what counts as prior art.",c:"35 U.S.C. 100(i)"},
 copendency:{t:"copendency",d:"The later application must be filed before the earlier one is patented, abandoned, or otherwise terminated. Without copendency a benefit claim under 35 U.S.C. 120 fails.",c:"35 U.S.C. 120; MPEP 211.01(b)"},
 specref:{t:"specific reference",d:"The explicit statement identifying the prior application by application number and relationship (continuation, divisional, CIP, or benefit of a provisional). It must be in the ADS for applications filed on or after Sept 16, 2012.",c:"37 CFR 1.78"},
 cip:{t:"continuation-in-part",d:"A later application repeating a substantial portion of an earlier application and adding new matter. Claims supported only by the new matter get the later filing date; claims supported by the earlier disclosure keep the earlier date.",c:"MPEP 201.08"},
 divisional:{t:"divisional",d:"An application carved out of an earlier application, typically for an invention that was restricted out. Divisionals filed because of a restriction requirement get the 35 U.S.C. 121 shield against double patenting.",c:"MPEP 201.06"},
 aia:{t:"AIA",d:"The Leahy-Smith America Invents Act. It moved the U.S. to first-inventor-to-file. AIA 102/103 apply to applications with an effective filing date on or after March 16, 2013; earlier ones stay under pre-AIA law.",c:"MPEP 2159"},
 priorart:{t:"prior art",d:"The body of public knowledge used to reject a claim as not new (102) or as obvious (103).",c:"MPEP 2121"},
 grace:{t:"grace period",d:"The one-year window before the effective filing date in which an inventor's own disclosure — or a disclosure derived from the inventor — does not count as prior art against them.",c:"35 U.S.C. 102(b)(1)"},
 anticipation:{t:"anticipation",d:"A single prior art reference contains every element of the claim, arranged as claimed, and enables it. If so, the claim is not novel under 102.",c:"MPEP 2131"},
 obvious:{t:"obviousness",d:"Even if no single reference shows the invention, a claim fails under 103 if the differences would have been obvious to a person of ordinary skill in the art before the effective filing date.",c:"35 U.S.C. 103"},
 posita:{t:"person of ordinary skill",d:"The hypothetical, ordinarily creative worker in the field, presumed to know all the relevant prior art. Obviousness is judged through this person's eyes.",c:"MPEP 2141.03"},
 graham:{t:"Graham factors",d:"The four inquiries underlying every obviousness analysis: scope and content of the prior art; differences between the prior art and the claims; level of ordinary skill; and objective evidence (secondary considerations).",c:"MPEP 2141"},
 secondary:{t:"secondary considerations",d:"Objective evidence of nonobviousness: commercial success, long-felt but unsolved need, failure of others, unexpected results, copying, skepticism. Must have a nexus to the claimed features.",c:"MPEP 716"},
 primafacie:{t:"prima facie case",d:"The examiner's initial burden. Once the examiner sets out a reasoned rejection on its face, the burden shifts to the applicant to rebut it with argument or evidence.",c:"MPEP 2142"},
 analogous:{t:"analogous art",d:"A reference is available for obviousness if it is in the same field of endeavor as the invention, or, if not, is reasonably pertinent to the particular problem the inventor faced.",c:"MPEP 2141.01(a)"},
 wd:{t:"written description",d:"The specification must show the inventor was in possession of the claimed invention at filing. Separate and distinct from enablement.",c:"35 U.S.C. 112(a); MPEP 2163"},
 enable:{t:"enablement",d:"The specification must teach a person skilled in the art how to make and use the full scope of the claimed invention without undue experimentation.",c:"35 U.S.C. 112(a); MPEP 2164"},
 wands:{t:"Wands factors",d:"The eight factors weighed to decide whether experimentation is 'undue': quantity of experimentation, direction or guidance given, working examples, nature of the invention, state of the prior art, skill level, predictability of the art, and breadth of the claims.",c:"MPEP 2164.01(a)"},
 bestmode:{t:"best mode",d:"The specification must set out the best way the inventor knows of carrying out the invention. Still required by 112(a), but since the AIA, failure to disclose it cannot be used to invalidate or cancel a claim.",c:"35 U.S.C. 112(a), 282; MPEP 2165"},
 definite:{t:"definiteness",d:"The claims must particularly point out and distinctly claim the subject matter. During examination, indefiniteness is measured by whether the claim is unclear when read in light of the specification by a skilled artisan.",c:"35 U.S.C. 112(b); MPEP 2173"},
 mpf:{t:"means-plus-function",d:"A claim limitation expressed as a means for performing a function, without reciting sufficient structure. It is construed to cover only the corresponding structure disclosed in the specification and its equivalents — and if no structure is disclosed, the claim is indefinite.",c:"35 U.S.C. 112(f); MPEP 2181"},
 newmatter:{t:"new matter",d:"Subject matter not present in the application as originally filed. It can never be added by amendment.",c:"35 U.S.C. 132(a); MPEP 2163.06"},
 eligibility:{t:"subject matter eligibility",d:"The 101 question: is the claim to a process, machine, manufacture, or composition of matter, and does it avoid being directed to a judicial exception without more?",c:"MPEP 2106"},
 exception:{t:"judicial exception",d:"Abstract ideas, laws of nature, and natural phenomena — court-created carve-outs from 101 eligibility.",c:"MPEP 2106.04"},
 alice:{t:"Alice/Mayo test",d:"Step 2A asks whether the claim recites a judicial exception (prong one) and, if so, whether it integrates it into a practical application (prong two). Step 2B asks whether the additional elements amount to significantly more than the exception itself.",c:"MPEP 2106.04, 2106.05"},
 utility:{t:"utility",d:"The invention must have a specific, substantial, and credible use. Rejections for lack of utility under 101 are normally paired with a 112(a) enablement rejection.",c:"MPEP 2107"},
 ssp:{t:"shortened statutory period",d:"The reply deadline the Office actually sets — usually three months for an Office action on the merits — inside the six-month statutory maximum.",c:"35 U.S.C. 133; MPEP 710.02(b)"},
 ext:{t:"extension of time",d:"Under 37 CFR 1.136(a) an applicant may buy up to five months of extension by fee, but never past the six-month statutory limit. Where 1.136(a) is unavailable, 1.136(b) extensions must be requested with a showing of sufficient cause.",c:"37 CFR 1.136"},
 abandon:{t:"abandonment",d:"An application goes abandoned when a required reply is not filed within the set period, or the reply is not complete and bona fide.",c:"35 U.S.C. 133; MPEP 711"},
 revival:{t:"revival",d:"A petition under 37 CFR 1.137 to revive an unintentionally abandoned application, requiring the reply, the petition fee, and a statement that the entire delay was unintentional.",c:"37 CFR 1.137"},
 certmail:{t:"certificate of mailing",d:"A signed statement under 37 CFR 1.8 that a paper was deposited with the USPS on a given date; the paper is then treated as filed that date. It does not apply to a new application filing or certain other papers.",c:"37 CFR 1.8"},
 pme:{t:"Priority Mail Express",d:"Under 37 CFR 1.10, a paper deposited with the USPS Priority Mail Express service is accorded the 'date-in' date shown on the mailing label as its filing date — this one does work for new applications.",c:"37 CFR 1.10"},
 final:{t:"final rejection",d:"The second or later Office action making rejections final. After it, the applicant's options narrow sharply: appeal, an amendment complying with 37 CFR 1.116, or an RCE.",c:"37 CFR 1.113; MPEP 706.07"},
 rce:{t:"RCE",d:"Request for Continued Examination — a fee plus a submission that pulls a finally-rejected application back into prosecution without filing a new application. Not available for provisionals or design applications.",c:"37 CFR 1.114"},
 cpa:{t:"CPA",d:"Continued Prosecution Application under 37 CFR 1.53(d) — now available only for design applications.",c:"37 CFR 1.53(d)"},
 ptab:{t:"PTAB",d:"Patent Trial and Appeal Board — hears ex parte appeals from examiner rejections and conducts post-grant trials such as IPR and PGR.",c:"35 U.S.C. 6"},
 restriction:{t:"restriction requirement",d:"When two or more independent and distinct inventions are claimed in one application and searching them together would be a serious burden, the examiner requires the applicant to elect one for examination.",c:"35 U.S.C. 121; MPEP 803"},
 traverse:{t:"traverse",d:"To elect an invention while formally disagreeing with the restriction, preserving the right to petition. Electing without traverse gives that right up.",c:"MPEP 818.01"},
 odp:{t:"double patenting",d:"Statutory double patenting bars a second claim to the same invention. Nonstatutory (obviousness-type) double patenting bars a claim that is an obvious variant of one already claimed — and can be overcome by a terminal disclaimer.",c:"MPEP 804"},
 td:{t:"terminal disclaimer",d:"A filing that disclaims the tail end of a patent's term so it expires with the earlier patent, and binds the two to remain commonly owned. It overcomes nonstatutory but never statutory double patenting.",c:"37 CFR 1.321(c)"},
 reissue:{t:"reissue",d:"A way to correct a patent that is wholly or partly inoperative or invalid through error, by surrendering it and having it reissued. Broadening reissues must be applied for within two years of grant.",c:"35 U.S.C. 251; MPEP 1400"},
 recapture:{t:"recapture",d:"A reissue applicant may not recover subject matter that was deliberately surrendered during original prosecution to get the patent allowed.",c:"MPEP 1412.02"},
 reexam:{t:"ex parte reexamination",d:"Any person, including the patent owner, may ask the Office to re-examine an issued patent — but only on patents and printed publications, and only if they raise a substantial new question of patentability.",c:"35 U.S.C. 302; MPEP 2200"},
 snq:{t:"substantial new question",d:"The threshold for ordering ex parte reexamination: the prior art raises a question of patentability that the Office has not already considered in the same way.",c:"35 U.S.C. 303; MPEP 2242"},
 coc:{t:"certificate of correction",d:"The mechanism for fixing mistakes in an issued patent. Office mistakes are corrected without fee under 35 U.S.C. 254; applicant mistakes of a clerical or minor nature made in good faith are corrected for a fee under 255.",c:"MPEP 1480, 1481"},
 ipr:{t:"inter partes review",d:"A PTAB trial that a third party may file after nine months from grant, limited to 102 and 103 grounds based on patents and printed publications.",c:"35 U.S.C. 311"},
 pgr:{t:"post-grant review",d:"A PTAB trial available only within nine months of grant for AIA patents, on essentially any ground of invalidity.",c:"35 U.S.C. 321"},
 pct:{t:"PCT",d:"The Patent Cooperation Treaty — one international application that preserves the right to file in many countries, with the national stage typically entered at 30 months from the priority date.",c:"MPEP 1800"},
 isa:{t:"ISA",d:"International Searching Authority — performs the international search and issues the international search report and a written opinion on patentability.",c:"MPEP 1840"},
 ffl:{t:"foreign filing license",d:"Required before filing abroad an invention made in the United States. It is usually granted on the filing receipt; otherwise a petition may be filed, or one may wait six months from the U.S. filing date.",c:"35 U.S.C. 184; MPEP 140"},
 ffd:{t:"foreign priority",d:"A claim under 35 U.S.C. 119(a)-(d) to the filing date of an application filed in a foreign country, made within 12 months (6 for designs) and supported by a certified copy.",c:"MPEP 213"}
};

const MODULES=[
{id:"exam",track:"I",fig:"1.1",title:"The Examination Itself",
 blurb:"Format, sources, scoring, and how to actually use an open-book exam.",
 teach:[{h:"What you are walking into",p:[
  "The registration examination is 100 multiple-choice questions delivered in two three-hour sessions of 50 questions each, with an optional timed one-hour break between them. Every question has five answer choices. Only 90 questions are scored; ten are unmarked beta questions the Office is trialing, and you cannot tell which. You need 63 of the 90 scored questions right — 70 percent — to pass.",
  "The questions come from a fixed set of source materials: the [[mpep|MPEP]], Ninth Edition, Revision 01.2024, together with the Consolidated Trial Practice Guide of November 2019, the Changes to Representation of Others Before the USPTO final rules, and the Global/IP5 Patent Prosecution Highway notice. Anything decided after those materials — a newer Federal Circuit case, a 2025 rule change — is not the answer the exam wants.",
  "It is open book, and that is the trap. The [[mpep|MPEP]] is searchable on the exam computer, but you have roughly three minutes per question. If you do not already know which chapter holds the answer, the search will eat the clock. The skill being tested is knowing the structure well enough to land in the right chapter in seconds, then confirming the detail."]},
  {h:"How to read the questions",p:[
   "Most stems are one of three shapes. 'Which of the following is most correct' wants the single best answer, not merely a true statement. 'All of the following are true EXCEPT' wants you to find the one false item — read it as four confirmations and one lie. And fact-pattern questions give you a dated sequence of events and ask what the practitioner should do; those are almost always about deadlines, [[priorart|prior art]] dates, or reply options.",
   "Watch the dates in every fact pattern. A filing date before or after March 16, 2013 decides whether pre-AIA or [[aia|AIA]] prior art law applies, and that single fact flips the correct answer in a large share of questions."]}],
 qs:[
 {q:"How many questions on the registration examination are scored, and how many must be answered correctly to pass?",
  o:["100 scored; 70 correct required","90 scored; 63 correct required","90 scored; 70 correct required","100 scored; 63 correct required","95 scored; 66 correct required"],a:1,
  why:"Of the 100 multiple-choice questions, only 90 are scored. The other ten are beta questions distributed through the exam and are not identified to you. Seventy percent of 90 is 63.",
  cite:"USPTO, Registration Examination; General Requirements Bulletin"},
 {q:"How many answer choices does each question on the registration examination have?",
  o:["Three","Four","Five","Six","It varies by session"],a:2,
  why:"Each question has five choices. Practice material built on four-option questions understates how much distractor elimination the real exam demands.",
  cite:"General Requirements Bulletin, Section B"},
 {q:"Which of the following is NOT among the source materials for the registration examination?",
  o:["MPEP, Ninth Edition, Revision 01.2024","The Consolidated Trial Practice Guide, November 2019","Changes to Representation of Others Before the USPTO final rules","The Global/IP5 Patent Prosecution Highway pilot notice","The most recent Federal Circuit decisions on subject matter eligibility"],a:4,
  why:"The exam draws only on the published source list. Case law matters only as it is already reflected in the MPEP; recent decisions not incorporated into Revision 01.2024 are outside the tested material.",
  cite:"USPTO, Source Materials for the Registration Examination"},
 {q:"A candidate fails the examination. Under the standard rule, how soon may that candidate retake it?",
  o:["Immediately","After 30 days","After 60 days","After 90 days","After six months"],a:1,
  why:"A failed candidate must wait at least 30 days before retaking, and must submit a new application and pay the fees again.",
  cite:"General Requirements Bulletin"},
 {q:"Which statement best describes the effect of the examination being open book?",
  o:["Memorization is unnecessary because every answer can be looked up in the time allowed","The MPEP is available on the exam computer, but roughly three minutes per question means lookup only works if you already know where to look","Candidates may bring their own annotated copy of the MPEP","Only the statutes, not the MPEP, are available during the exam","Reference materials are available only during the afternoon session"],a:1,
  why:"Reference materials are provided on the computer delivering the exam, and no outside materials of any kind may be brought in. The pacing is what makes structural familiarity essential.",
  cite:"General Requirements Bulletin, Sections B and C"},
 {q:"A fact pattern states that an application was filed on February 1, 2013 with no earlier priority claim. Which body of law governs the prior art analysis?",
  o:["AIA 35 U.S.C. 102 and 103","Pre-AIA 35 U.S.C. 102 and 103","AIA 102 but pre-AIA 103","Whichever the applicant elects","Pre-AIA 102 but AIA 103"],a:1,
  why:"AIA 102 and 103 apply only to applications having an effective filing date on or after March 16, 2013. A February 1, 2013 filing with no earlier claim falls under pre-AIA law entirely.",
  cite:"MPEP 2159.02; AIA Sec. 3(n)"}
]},

{id:"practice",track:"I",fig:"1.2",title:"Who May Practice, and How They Sign",
 blurb:"Agents vs. attorneys, powers of attorney, correspondence, signatures, and the 11.18 certification.",
 teach:[{h:"The register and what it lets you do",p:[
  "The [[oed|Office of Enrollment and Discipline]] maintains the register. A registered [[agent|patent agent]] and a registered patent attorney have exactly the same powers before the USPTO in patent cases: drafting, filing, prosecuting, appealing to the [[ptab|PTAB]]. The difference is everywhere else. An agent is not a lawyer and may not do things that constitute the practice of law — appearing in court, rendering an infringement or validity opinion as legal advice, negotiating a license as counsel.",
  "An [[applicant|applicant]] who is the inventor may prosecute their own application [[prose|pro se]]. A [[juristic|juristic entity]] — a company, a university — may not; it must act through a [[practitioner|registered practitioner]]. That single distinction generates a steady stream of exam questions."]},
  {h:"Paper hygiene",p:[
   "A [[poa|power of attorney]] must be signed by the applicant or by an assignee who has properly become the applicant. There is one correspondence address per application, and the Office will send everything there and nowhere else.",
   "Signatures follow 37 CFR 1.4. An [[ssig|S-signature]] sits between two forward slashes, must be personally inserted by the signer, and a practitioner must print or type their name and registration number next to it. And every paper filed carries the certifications of 37 CFR 11.18 — that the statements are true, that the paper is not filed for an improper purpose, and that the legal contentions are warranted."]}],
 qs:[
 {q:"Which of the following may a registered patent agent NOT do?",
  o:["Prepare and file a patent application for a client","Prosecute the application and respond to Office actions","Represent the applicant in an ex parte appeal before the PTAB","Represent a client in an infringement suit in federal district court","Conduct an examiner interview on the client's behalf"],a:3,
  why:"An agent has the same authority as an attorney in patent cases before the Office, but is not admitted to any bar and cannot represent anyone in court or otherwise practice law generally.",
  cite:"37 CFR 11.5(b)(1); MPEP 402"},
 {q:"A corporation is the applicant of record. Which is most correct?",
  o:["The corporation may file papers on its own behalf through any employee","The corporation must be represented by a registered practitioner","An officer of the corporation may sign as the applicant pro se","The corporation may prosecute pro se only if it also owns the invention outright","Any employee with a technical degree may sign amendments"],a:1,
  why:"A juristic entity applicant must prosecute through a registered practitioner; it cannot proceed pro se. Only an inventor-applicant may act for himself or herself.",
  cite:"37 CFR 1.31, 1.33(b)(3); MPEP 402"},
 {q:"Which of the following is a proper S-signature under 37 CFR 1.4(d)(2) for a registered practitioner?",
  o:["John Q. Public","/s/ John Q. Public","/John Q. Public/ typed by his secretary at his direction","/John Q. Public/ John Q. Public, Reg. No. 12,345","[Signed electronically] John Q. Public"],a:3,
  why:"The signature must be inserted personally by the signer between forward slashes, and a practitioner must also print or type his or her name and registration number adjacent to the S-signature.",
  cite:"37 CFR 1.4(d)(2); MPEP 502.02"},
 {q:"How many correspondence addresses will the Office recognize in a single application?",
  o:["One","Two, if both are practitioners of record","One per named inventor","As many as the applicant designates","Two, one of which must be the applicant"],a:0,
  why:"The Office will direct all notices, official letters, and other communications to a single correspondence address of record.",
  cite:"37 CFR 1.33(a); MPEP 403"},
 {q:"By presenting a paper to the Office, a party certifies all of the following EXCEPT:",
  o:["The statements made of the party's own knowledge are true","The paper is not being presented for any improper purpose such as delay","The legal contentions are warranted by existing law or a nonfrivolous argument for changing it","The allegations have evidentiary support or are likely to after investigation","That a prior art search of the relevant field has been conducted"],a:4,
  why:"37 CFR 11.18(b) requires those certifications, but neither it nor Rule 56 imposes any duty to search for prior art.",
  cite:"37 CFR 11.18(b); MPEP 410"},
 {q:"Who may properly sign a power of attorney in an application filed on or after September 16, 2012?",
  o:["Any inventor, even if not the applicant","The applicant, or an assignee who has become the applicant under 37 CFR 3.71","Any registered practitioner acquainted with the case","The corporation's general counsel, whether or not registered","Whoever paid the filing fee"],a:1,
  why:"The power of attorney must be signed by the applicant for patent or the patent owner, which includes an assignee that has taken over as the applicant of record.",
  cite:"37 CFR 1.32(b)(4); MPEP 402.02(a)"}
]},

{id:"ids",track:"I",fig:"1.3",title:"Duty of Disclosure and the IDS",
 blurb:"Rule 56 candor, and the three timing tiers of Rule 97 that decide fee, statement, or both.",
 teach:[{h:"The duty",p:[
  "Each individual associated with the filing and prosecution of an application owes the Office a [[duty|duty of candor and good faith]], which includes disclosing all information known to that individual to be [[material|material to patentability]]. That covers the inventors, each practitioner involved, and every other person substantively involved in preparing or prosecuting the application.",
  "Two boundaries matter. There is no duty to search — the duty runs only to what you actually know. And cumulative information need not be submitted; if a reference says nothing the examiner already has, Rule 56 does not require it."]},
  {h:"The three windows of Rule 97",p:[
   "An [[ids|IDS]] is always considered if filed within three months of the filing date, or before the first Office action on the merits, whichever is later — with no fee and no statement.",
   "After that but before a [[final|final rejection]] or a notice of allowance, you need either the 37 CFR 1.97(e) statement or the fee. After final or allowance but before the issue fee is paid, you need both the statement and the fee. Once the issue fee is paid, an IDS will not be considered at all, and the practical fix is to withdraw from issue or use the QPIDS route.",
   "The 1.97(e) statement is a certification of one of two things: that each item was first cited in a communication from a foreign patent office not more than three months before the IDS, or that no item was known to any individual having the duty of disclosure more than three months before the IDS.",
   "Rule 98 governs content: a list on a separate paper, legible copies of foreign patent documents and non-patent literature, and for anything not in English, a concise explanation of relevance or an existing English translation."]}],
 qs:[
 {q:"An IDS is filed four months after the filing date, after the first Office action on the merits but before any final rejection. What is required for it to be considered?",
  o:["Nothing — it is automatically considered","Either the 37 CFR 1.97(e) statement or the fee","Both the statement and the fee","The fee only, in every case","A petition to the Director"],a:1,
  why:"This is the middle window of 37 CFR 1.97(c): after the first Office action on the merits but before a final action, a notice of allowance, or an action closing prosecution, the IDS is considered if accompanied by either the 1.97(e) statement or the specified fee.",
  cite:"37 CFR 1.97(c); MPEP 609.04(b)"},
 {q:"An IDS is filed after a final rejection but before the issue fee has been paid. What is required?",
  o:["Nothing","The fee only","The 1.97(e) statement only","Both the 1.97(e) statement and the fee","It cannot be considered under any circumstance"],a:3,
  why:"In the third window under 37 CFR 1.97(d), the IDS must be accompanied by both the statement specified in 1.97(e) and the required fee.",
  cite:"37 CFR 1.97(d); MPEP 609.04(b)"},
 {q:"Which statement about the duty of disclosure is most correct?",
  o:["It requires a reasonable search of the prior art before filing","It requires disclosure of all information the individual knows to be material, but imposes no duty to search","It applies only to the named inventors","It ends when the first Office action issues","It requires submission of cumulative references to ensure completeness"],a:1,
  why:"Rule 56 is a duty of candor about what you know. No search is required, and cumulative information need not be submitted. The duty runs to each individual substantively involved and continues until the patent issues or the application is abandoned.",
  cite:"37 CFR 1.56(a); MPEP 2001.04, 2004"},
 {q:"An IDS lists a Japanese-language patent document. Which is required under 37 CFR 1.98?",
  o:["A full certified translation into English in every case","A concise explanation of the relevance, or an English translation if one is readily available","Nothing beyond the citation, since the examiner can obtain it","An affidavit from a translator","Only the English abstract, in all cases"],a:1,
  why:"For information not in English, Rule 98 requires a concise explanation of relevance, or an existing English-language written translation if it is readily available to the applicant.",
  cite:"37 CFR 1.98(a)(3); MPEP 609.04(a)"},
 {q:"Information is material to patentability under 37 CFR 1.56(b) when it is not cumulative and it does which of the following?",
  o:["Establishes, alone or in combination, a prima facie case of unpatentability, or refutes or is inconsistent with a position the applicant takes","Was cited by any foreign patent office in any family member","Was found in the applicant's own pre-filing search","Relates to the same technological field as the invention","Is a U.S. patent issued within the last twenty years"],a:0,
  why:"Rule 56(b) defines materiality by that two-part test, judged on a prima facie basis giving claims their broadest reasonable construction.",
  cite:"37 CFR 1.56(b); MPEP 2001.05"},
 {q:"An IDS is submitted after the issue fee has been paid. What is the result?",
  o:["It will be considered if the fee is paid","It will be considered if the 1.97(e) statement accompanies it","It will not be considered as a matter of course; the application must be withdrawn from issue or the QPIDS procedure used","It automatically triggers a certificate of correction","It converts the application to a continuation"],a:2,
  why:"An IDS filed after payment of the issue fee will not be considered. The practical routes are a petition to withdraw from issue under 37 CFR 1.313 with an RCE, or the Quick Path IDS pilot.",
  cite:"37 CFR 1.97(d); MPEP 609.04(b)"},
 {q:"Which individuals owe the duty of disclosure?",
  o:["Only the named inventors","Only the practitioner who signs the papers","Each inventor, each attorney or agent involved, and every other person substantively involved in preparing or prosecuting the application who is associated with the inventor or assignee","The assignee's entire legal department, without exception","Any person who has ever seen the application"],a:2,
  why:"Rule 56(c) identifies those three categories of individuals associated with the filing and prosecution of the application.",
  cite:"37 CFR 1.56(c); MPEP 2001.01"}
]}
];
MODULES.push(
{id:"filing",track:"II",fig:"2.1",title:"Getting a Filing Date",
 blurb:"What the Office must receive, provisionals, the ADS, and the oath or declaration.",
 teach:[{h:"The minimum to secure a date",p:[
  "For a [[nonprov|nonprovisional]] application filed on or after December 18, 2013, the Office grants a filing date when it receives a specification, with drawings where necessary to understand the invention. Claims are still required, but their absence no longer costs you the filing date — the Office issues a Notice to File Missing Parts and gives you a period to supply the claims and pay a surcharge.",
  "A [[provisional|provisional application]] needs a specification and any necessary drawings, plus the cover sheet identifying it as provisional. It needs no claims, no oath, no [[ids|IDS]]. It is never examined, it goes abandoned automatically twelve months after filing, and it cannot itself become a patent. What it does is hold an [[efd|effective filing date]] for anything it adequately describes and enables — an important caveat, since a thin provisional supports nothing."]},
  {h:"The ADS and the oath",p:[
   "The [[ads|Application Data Sheet]] is not optional in practice. Domestic benefit claims and [[ffd|foreign priority]] claims must appear in the ADS to be effective for applications filed on or after September 16, 2012, and the ADS controls where it conflicts with the specification.",
   "The inventor's oath or declaration under 37 CFR 1.63 may be postponed. It must be filed no later than the date the issue fee is paid, and the Office will not allow an application without it. Where an inventor cannot be reached, refuses to sign, or has died, a substitute statement under 1.64 may be used by the applicant."]}],
 qs:[
 {q:"An application under 35 U.S.C. 111(a) is filed on March 1, 2024 containing a specification and drawings but no claims. What is the result?",
  o:["No filing date is granted until claims are filed","A filing date is granted; the Office will issue a Notice to File Missing Parts requiring claims and a surcharge","The application is treated as a provisional","The application is returned to the applicant unfiled","A filing date is granted only if a petition and fee are filed"],a:1,
  why:"Under the Patent Law Treaties Implementation Act, applications filed on or after December 18, 2013 receive a filing date upon receipt of a specification with or without claims. Claims remain required and are demanded by a Notice to File Missing Parts, with a surcharge.",
  cite:"35 U.S.C. 111(a); 37 CFR 1.53(f); MPEP 601.01(a)"},
 {q:"Which of the following is NOT required for a provisional application to receive a filing date?",
  o:["A specification as prescribed by 35 U.S.C. 112(a)","Drawings where necessary to understand the invention","At least one claim","A cover sheet identifying the application as provisional","The name of at least one inventor"],a:2,
  why:"A provisional requires no claims. It also requires no oath or declaration and no IDS, and it is never examined.",
  cite:"35 U.S.C. 111(b); 37 CFR 1.51(c); MPEP 201.04"},
 {q:"By what date must the inventor's oath or declaration be filed in a nonprovisional application filed on or after September 16, 2012?",
  o:["On the filing date","Within three months of the filing date","No later than the date on which the issue fee is paid","Within two months of the first Office action","Before any amendment is entered"],a:2,
  why:"The oath or declaration may be postponed until the application is otherwise in condition for allowance, but it must be filed no later than the date the issue fee is paid, and an ADS naming the inventors must have been filed.",
  cite:"37 CFR 1.53(f)(3); MPEP 602.01"},
 {q:"An inventor has died before executing the oath. Which is most correct?",
  o:["The application cannot proceed","The remaining inventors may sign on the deceased inventor's behalf","The applicant may execute a substitute statement under 37 CFR 1.64","A petition to the Director under 37 CFR 1.183 is required","The deceased inventor must be removed from the application"],a:2,
  why:"A substitute statement under Rule 64 is available where the inventor is deceased, legally incapacitated, cannot be found after diligent effort, or refuses to execute the oath.",
  cite:"37 CFR 1.64; MPEP 604"},
 {q:"A benefit claim to a provisional application appears only in the first sentence of the specification of a nonprovisional filed in 2024, and not in the ADS. What is the effect?",
  o:["The claim is effective because the specification controls","The claim is effective because either location is acceptable","The claim is not effective; the specific reference must be in the ADS","The claim is effective only if the provisional is also referenced on the filing receipt","The Office will enter the claim automatically"],a:2,
  why:"For applications filed on or after September 16, 2012, the specific reference required by 35 U.S.C. 119(e) or 120 must be in the ADS. A reference only in the specification does not perfect the claim.",
  cite:"37 CFR 1.78(a)(3), (d)(2); MPEP 211.02"},
 {q:"Which statement about a provisional application is most correct?",
  o:["It is examined on the merits within twelve months","It may be extended beyond twelve months upon petition and fee","It automatically becomes abandoned twelve months after its filing date","It may issue as a patent if allowed","It must contain at least one independent claim"],a:2,
  why:"A provisional is not examined and goes abandoned by operation of law twelve months after filing. It cannot be extended, although the period for filing a later nonprovisional may in narrow circumstances be restored under 37 CFR 1.78(b).",
  cite:"35 U.S.C. 111(b)(5); MPEP 201.04"},
 {q:"A paper deposited with the U.S. Postal Service is to be given the date it was deposited rather than the date the Office received it. Which is correct?",
  o:["A certificate of mailing under 37 CFR 1.8 works for a new patent application","Priority Mail Express under 37 CFR 1.10 gives the date-in date shown on the label, and does work for a new application","Both 1.8 and 1.10 work for new applications","Neither works for any paper","Only first-class mail with a certificate of transmission qualifies"],a:1,
  why:"The certificate of mailing under Rule 8 does not apply to the filing of a new application, among other exclusions. Priority Mail Express under Rule 10 accords the date-in date as the filing date and may be used for a new application.",
  cite:"37 CFR 1.8(a)(2), 1.10; MPEP 512, 513"}
]},

{id:"benefit",track:"II",fig:"2.2",title:"Priority and Benefit Claims",
 blurb:"Sections 119, 120, and 121 — copendency, specific reference, and what a claim buys you.",
 teach:[{h:"Reaching backward",p:[
  "Three doors lead back to an earlier date. Section 119(e) reaches a [[provisional|provisional]] within twelve months. Section 120 reaches an earlier nonprovisional — a continuation, [[divisional|divisional]], or [[cip|continuation-in-part]]. Sections 119(a)-(d) reach a [[ffd|foreign application]] within twelve months, six for designs.",
  "For a domestic benefit claim under 120 you need four things at once: [[copendency|copendency]], at least one common inventor, a [[specref|specific reference]] in the [[ads|ADS]], and disclosure in the earlier application that satisfies 112(a) for the claimed invention. Miss any one and the claim fails — and the earlier application may then become [[priorart|prior art]] against you."]},
  {h:"What the claim actually covers",p:[
   "A benefit claim is judged claim by claim, not application by application. In a [[cip|CIP]], claims fully supported by the parent get the parent's date; claims relying on the new matter get the CIP's own filing date. The same logic governs a provisional: if the provisional does not describe and enable what you now claim, the claim keeps the later date no matter what the ADS says.",
   "A delayed benefit or priority claim can often be repaired. A petition under 37 CFR 1.78 or 1.55, the fee, and a statement that the entire delay was unintentional will accept a claim filed after the deadline."]}],
 qs:[
 {q:"Which of the following is NOT required for a valid benefit claim under 35 U.S.C. 120?",
  o:["Copendency between the applications","At least one common inventor","A specific reference to the prior application in the ADS","Disclosure in the prior application satisfying 35 U.S.C. 112(a) for the claimed invention","Identical inventive entities in both applications"],a:4,
  why:"Section 120 requires only at least one common inventor, not identity of inventorship.",
  cite:"35 U.S.C. 120; 37 CFR 1.78(d); MPEP 211.01(b)"},
 {q:"A parent application issues as a patent on June 1. A purported continuation is filed on June 15 with a proper specific reference. Is the benefit claim under 120 valid?",
  o:["Yes, because the reference was proper","Yes, if a petition and fee are filed","No, because copendency was broken when the parent issued","No, unless the continuation adds no new matter","Yes, because the parent and continuation share an inventor"],a:2,
  why:"The later application must be filed before the patenting, abandonment, or termination of proceedings on the earlier one. Copendency ends the day the parent issues, so a June 15 filing is too late.",
  cite:"35 U.S.C. 120; MPEP 211.01(b)"},
 {q:"A nonprovisional claims benefit of a provisional. Claim 1 is fully described in the provisional; claim 5 is directed to an embodiment first disclosed in the nonprovisional. What are the effective filing dates?",
  o:["Both claims get the provisional's filing date","Both claims get the nonprovisional's filing date","Claim 1 gets the provisional's date; claim 5 gets the nonprovisional's date","Claim 5 is improper and must be canceled","Claim 1 gets the nonprovisional's date; claim 5 gets the provisional's date"],a:2,
  why:"Benefit is determined on a claim-by-claim basis. Only claims supported under 112(a) by the earlier disclosure get the earlier date.",
  cite:"35 U.S.C. 119(e); MPEP 211.05"},
 {q:"An applicant filed in Germany on March 3, 2023 and wishes to claim foreign priority in a U.S. utility application. The U.S. application must be filed no later than:",
  o:["March 3, 2024","September 3, 2023","March 3, 2025","Six months from the German filing","Eighteen months from the German filing"],a:0,
  why:"A foreign priority claim under 119(a) requires filing in the United States within twelve months of the foreign filing for a utility application. Design applications get six months.",
  cite:"35 U.S.C. 119(a); MPEP 213.03"},
 {q:"A benefit claim under 120 was inadvertently omitted from the ADS and the deadline has passed. What is the appropriate remedy?",
  o:["Nothing can be done","File a certificate of correction after issuance only","File a petition under 37 CFR 1.78 with the fee and a statement that the entire delay was unintentional","File a reissue application","Petition the Director under 37 CFR 1.183 to waive the rule"],a:2,
  why:"A delayed benefit claim may be accepted on petition under Rule 78, accompanied by the reference, the petition fee, and a statement of unintentional delay.",
  cite:"37 CFR 1.78(c), (e); MPEP 211.04"},
 {q:"What protection does 35 U.S.C. 121 give to a divisional application?",
  o:["It exempts the divisional from the duty of disclosure","It bars the Office from using the original application or the patent issuing on it as a reference for double patenting against the divisional, where the divisional was filed as a result of a restriction requirement","It guarantees allowance of the restricted-out claims","It extends the term of the divisional","It removes the need for a specific reference"],a:1,
  why:"The 121 safe harbor protects a divisional filed as a result of a restriction requirement, provided the claims are consonant with the restriction.",
  cite:"35 U.S.C. 121; MPEP 804.01"},
 {q:"An applicant misses the twelve-month deadline for filing a nonprovisional claiming benefit of a provisional by 21 days. Which is most correct?",
  o:["The benefit is irretrievably lost","The benefit period may be restored on petition filed within two months of the expiration, with the fee and a statement of unintentional delay","The provisional automatically extends to fourteen months","A certificate of correction restores the claim","The applicant must refile the provisional"],a:1,
  why:"37 CFR 1.78(b) permits restoration of the benefit of a provisional where the nonprovisional is filed within fourteen months and the petition is filed with the required fee and statement that the delay was unintentional.",
  cite:"37 CFR 1.78(b); MPEP 211.01(a)"}
]},

{id:"aia102",track:"II",fig:"2.3",title:"AIA 102 — Prior Art and the Grace Period",
 blurb:"What counts as prior art, the one-year shield, and the exceptions that remove references.",
 teach:[{h:"Two buckets of prior art",p:[
  "[[aia|AIA]] 102(a)(1) is the public-disclosure bucket: a claimed invention is unpatentable if it was patented, described in a printed publication, in public use, on sale, or otherwise available to the public before the [[efd|effective filing date]]. Note what is gone from pre-AIA law — there is no longer any geographic limit. Public use in Norway now counts.",
  "Section 102(a)(2) is the earlier-filing bucket: a U.S. patent, U.S. patent application publication, or published PCT application naming another inventor and effectively filed before the applicant's effective filing date. This is prior art as of its own effective filing date, not its publication date. Either bucket can support an [[anticipation|anticipation]] rejection under [[usc|35 U.S.C.]] 102."]},
  {h:"The exceptions that give it back",p:[
   "Section 102(b)(1)(A) is the [[grace|grace period]]: a disclosure made one year or less before the effective filing date does not count if it was made by the inventor, by a joint inventor, or by someone who obtained the subject matter from them. Subsection (B) goes further — if the inventor publicly disclosed first, any later third-party disclosure of that subject matter within the year is also removed.",
   "Section 102(b)(2) removes 102(a)(2) references in three situations: the subject matter was obtained from the inventor; the inventor had already publicly disclosed it; or, under (b)(2)(C), the subject matter and the claimed invention were owned by, or subject to an obligation of assignment to, the same person not later than the effective filing date. That last one is the common-ownership exception, and it also disqualifies the reference for [[obvious|obviousness]] purposes."]}],
 qs:[
 {q:"Under AIA 35 U.S.C. 102(a)(1), which of the following is NOT a category of prior art?",
  o:["Patented","Described in a printed publication","In public use","On sale","Known or used by others in a foreign country only"],a:4,
  why:"The AIA removed the geographic limitations of pre-AIA law. Public use and on-sale activity anywhere in the world now qualify — so the distinction drawn in the last choice no longer exists as a limitation. Under AIA law the residual category is 'otherwise available to the public.'",
  cite:"35 U.S.C. 102(a)(1); MPEP 2152.02"},
 {q:"An inventor publishes an article describing the invention on May 1, 2023, and files an application claiming it on March 1, 2024. Is the article prior art against the application?",
  o:["Yes, because it was published before the filing date","No, because it was a disclosure by the inventor made one year or less before the effective filing date","Yes, unless the inventor files an affidavit under 37 CFR 1.132","No, because inventor publications are never prior art","Yes, but only under 103, not 102"],a:1,
  why:"AIA 102(b)(1)(A) excepts a disclosure made one year or less before the effective filing date when it was made by the inventor or a joint inventor.",
  cite:"35 U.S.C. 102(b)(1)(A); MPEP 2153.01(a)"},
 {q:"An inventor publicly discloses the invention on January 10. A third party independently publishes the same subject matter on March 5. The inventor files on December 1 of the same year. What is the status of the third-party publication?",
  o:["It is prior art under 102(a)(1)","It is excepted under 102(b)(1)(B) because the inventor publicly disclosed the subject matter first","It is prior art only under 103","It is prior art unless the third party assigns rights to the inventor","It is prior art because the inventor did not file within six months"],a:1,
  why:"Section 102(b)(1)(B) removes a third-party disclosure made within the grace period if the subject matter had already been publicly disclosed by the inventor or a joint inventor.",
  cite:"35 U.S.C. 102(b)(1)(B); MPEP 2153.02"},
 {q:"A U.S. patent application publication naming a different inventor was filed on February 2, 2022 and published August 10, 2023. The applicant's effective filing date is June 1, 2023. As of what date is the publication available as prior art under 102(a)(2)?",
  o:["August 10, 2023, its publication date","February 2, 2022, its effective filing date, so it is prior art","June 1, 2023","It is not prior art because it published after the applicant's filing date","Only as of the date the applicant became aware of it"],a:1,
  why:"A 102(a)(2) reference is prior art as of the date it was effectively filed, not when it published. Filed February 2022 and published at all, it predates the June 2023 effective filing date.",
  cite:"35 U.S.C. 102(a)(2), (d); MPEP 2154"},
 {q:"Two applications are owned by the same company. The earlier-filed one is used as a 102(a)(2) reference against the later. Which is most correct?",
  o:["The reference cannot be disqualified","The reference is disqualified under 102(b)(2)(C) if both were owned by, or under an obligation of assignment to, the same person not later than the effective filing date of the claimed invention","The reference is disqualified only for 102 purposes and remains available under 103","Disqualification requires a terminal disclaimer","Common ownership is irrelevant under the AIA"],a:1,
  why:"The common-ownership exception of 102(b)(2)(C) removes the reference entirely, for both novelty and obviousness. Note the measuring date is the effective filing date of the claimed invention.",
  cite:"35 U.S.C. 102(b)(2)(C); MPEP 2154.02(c)"},
 {q:"Which application is governed by AIA 35 U.S.C. 102?",
  o:["One filed March 1, 2013 with no priority claim","One filed March 16, 2013 with no priority claim","One filed April 2013 claiming benefit of a provisional filed January 2013, with all claims supported by the provisional","One filed in 2015 claiming benefit of a 2011 application, with all claims supported by it","One filed in 2010"],a:1,
  why:"AIA 102 and 103 apply where the effective filing date of at least one claim is on or after March 16, 2013. Choices with earlier supported priority keep pre-AIA law.",
  cite:"MPEP 2159.02, 2159.03"},
 {q:"Under AIA law, an invention was in public use in Japan more than one year before the effective filing date, and never described in any publication. Which is most correct?",
  o:["It is not prior art because the use was outside the United States","It is prior art under 102(a)(1)","It is prior art only if a U.S. person observed it","It is prior art only under 103","It is prior art only if the use was commercial"],a:1,
  why:"The AIA eliminated the geographic restriction on public use and on-sale activity. Public use anywhere before the effective filing date is prior art under 102(a)(1).",
  cite:"35 U.S.C. 102(a)(1); MPEP 2152.02(c)"},
 {q:"Which best states the effect of an anticipation rejection under 102?",
  o:["Two or more references together show every element","A single reference discloses every element of the claim, arranged as in the claim, and is enabling","The claim would have been obvious to one of ordinary skill","The claim lacks written description support","The claim covers a judicial exception"],a:1,
  why:"Anticipation requires a single reference that discloses each and every limitation, arranged as claimed, and that enables one of ordinary skill to make the invention.",
  cite:"MPEP 2131, 2131.01"}
]},

{id:"obviousness",track:"II",fig:"2.5",title:"Section 103 — Obviousness",
 blurb:"Graham, KSR, the prima facie case, and how an applicant pushes back.",
 teach:[{h:"Building the rejection",p:[
  "Section 103 asks whether the differences between the claimed invention and the [[priorart|prior art]] would have been obvious to a [[posita|person of ordinary skill in the art]] before the [[efd|effective filing date]]. Every analysis rests on the [[graham|Graham factors]]: the scope and content of the prior art, the differences, the level of ordinary skill, and any objective evidence.",
  "To make out a [[primafacie|prima facie case]], the examiner must articulate a reason a skilled artisan would have combined or modified the references with a reasonable expectation of success. After KSR, that reason need not be an explicit teaching, suggestion, or motivation in the references themselves — known techniques, design incentives, market forces, and ordinary creativity can supply it. But the examiner must still articulate it; a conclusory assertion is not enough."]},
  {h:"Pushing back",p:[
   "The applicant can attack the references — a reference is only usable if it is [[analogous|analogous art]], meaning it is in the same field of endeavor or is reasonably pertinent to the problem the inventor faced. The applicant can attack the reasoning, showing that the modification would render the primary reference unsatisfactory for its purpose or change its principle of operation. And the applicant can put in [[secondary|secondary considerations]] — commercial success, long-felt need, failure of others, unexpected results — which must be weighed, not brushed aside, and which require a nexus to the claimed invention."]}],
 qs:[
 {q:"Which is NOT one of the Graham v. John Deere factual inquiries?",
  o:["Determining the scope and content of the prior art","Ascertaining the differences between the prior art and the claims","Resolving the level of ordinary skill in the pertinent art","Evaluating objective evidence of nonobviousness","Determining whether the applicant conducted a prior art search"],a:4,
  why:"The Graham inquiries are the first four. Whether the applicant searched has no bearing on obviousness — and no search is required in the first place.",
  cite:"MPEP 2141, 2142"},
 {q:"After KSR, which statement about the reason to combine references is most correct?",
  o:["An explicit teaching, suggestion, or motivation must be found in the references","No reason at all need be given, since obviousness is a legal conclusion","The examiner must articulate a reason with rational underpinning, which may come from knowledge in the art, design incentives, or ordinary creativity","Any two references in the same field may always be combined","Only a published article may supply the motivation"],a:2,
  why:"KSR rejected a rigid TSM requirement but preserved the need for articulated reasoning with rational underpinning supporting the legal conclusion of obviousness.",
  cite:"MPEP 2141, 2143"},
 {q:"A reference from a different technological field is cited against the claims. When is it available as prior art under 103?",
  o:["Never, if it is from a different field","If it is in the same field of endeavor, or if it is reasonably pertinent to the particular problem with which the inventor was concerned","Only if the applicant cited it in an IDS","Only if it is a U.S. patent","Only if a skilled artisan would routinely read that journal"],a:1,
  why:"That two-part disjunctive test defines analogous art. Failing both prongs makes the reference unavailable for obviousness.",
  cite:"MPEP 2141.01(a)"},
 {q:"An applicant submits evidence of commercial success in response to an obviousness rejection. Which is most correct?",
  o:["It must be considered, but the applicant must show a nexus between the success and the claimed invention","It is irrelevant to obviousness","It automatically overcomes the rejection","It is considered only if the examiner requests it","It applies only to claims to a method"],a:0,
  why:"Objective evidence must always be considered when timely presented, but it carries weight only with a nexus to the claimed features rather than to unclaimed advantages such as advertising.",
  cite:"MPEP 716.03, 716.01(b)"},
 {q:"A proposed modification of the primary reference would render it unsatisfactory for its intended purpose. What follows?",
  o:["The modification is still proper if the secondary reference teaches it","There is no suggestion or motivation to make the modification, and the prima facie case fails","The rejection stands unless the applicant amends","The examiner must instead reject under 102","The applicant must file a terminal disclaimer"],a:1,
  why:"If the modification would render the prior art invention unsatisfactory for its intended purpose, or would change its principle of operation, the teachings are not sufficient to render the claims obvious.",
  cite:"MPEP 2143.01"},
 {q:"Under AIA 103, obviousness is judged as of what point in time?",
  o:["The date of invention","Before the effective filing date of the claimed invention","The date the application publishes","The date the first Office action issues","The date the patent issues"],a:1,
  why:"AIA 103 asks whether the claimed invention would have been obvious before the effective filing date, replacing the pre-AIA 'at the time the invention was made' standard.",
  cite:"35 U.S.C. 103; MPEP 2158"},
 {q:"Which of the following, standing alone, is sufficient to establish a prima facie case of obviousness?",
  o:["A statement that the claimed invention is within the skill of the art","Identification of all claim elements across two references plus an articulated reason to combine with a reasonable expectation of success","A finding that the references are in the same field","Evidence that the applicant's product sells well","A showing that the claim is broad"],a:1,
  why:"The prima facie case requires that the combination teach or suggest all claim limitations, that there be an articulated reason to combine, and that the skilled artisan would have had a reasonable expectation of success.",
  cite:"MPEP 2142, 2143"}
]},

{id:"s112",track:"II",fig:"2.6",title:"Section 112 — Disclosure and Claims",
 blurb:"Written description, enablement, definiteness, dependent claims, and means-plus-function.",
 teach:[{h:"Subsection (a): the bargain",p:[
  "The specification must contain a [[wd|written description]] of the invention, must [[enable|enable]] a skilled artisan to make and use it, and must set forth the [[bestmode|best mode]]. These are separate requirements. Written description asks whether you possessed what you now claim; enablement asks whether you taught the public how to practice it.",
  "Enablement does not require the specification to answer every question — only that no [[wands|undue experimentation]] be needed. The Wands factors weigh things like the predictability of the art, the amount of guidance given, the presence of working examples, and the breadth of the claims. And [[newmatter|new matter]] can never be added by amendment to cure a gap."]},
  {h:"Subsections (b) through (f): the claims",p:[
   "Subsection (b) demands [[definite|definiteness]]. During examination the standard is whether the claim is unclear when read in light of the specification by a skilled artisan — a lower bar for the examiner than the invalidity standard applied in court.",
   "Subsection (d) requires a dependent claim to further limit the claim it references. A claim that broadens or fails to include every limitation of its parent is improper. And subsection (f) allows a [[mpf|means-plus-function]] limitation, but it is construed to cover only the structure disclosed in the specification and equivalents — and if the specification discloses no corresponding structure, the claim is indefinite."]}],
 qs:[
 {q:"Which statement about written description and enablement is most correct?",
  o:["They are the same requirement stated two ways","They are separate requirements; a claim may be enabled yet lack adequate written description","Enablement is required only for chemical inventions","Written description applies only to original claims","Both were eliminated by the AIA"],a:1,
  why:"The written description requirement is separate and distinct from enablement. The test is whether the disclosure conveys that the inventor had possession of the claimed subject matter as of the filing date.",
  cite:"35 U.S.C. 112(a); MPEP 2161, 2163"},
 {q:"Which is NOT one of the Wands factors for undue experimentation?",
  o:["The quantity of experimentation necessary","The presence or absence of working examples","The predictability or unpredictability of the art","The breadth of the claims","The commercial success of the invention"],a:4,
  why:"Commercial success is a secondary consideration under 103, not a factor bearing on enablement.",
  cite:"MPEP 2164.01(a)"},
 {q:"An applicant amends the specification to add an example not present at filing, in order to support a claim. What is the proper action?",
  o:["The amendment is entered because it clarifies the disclosure","The amendment introduces new matter and must be objected to and the claim rejected under 112(a) if the claim relies on it","The amendment is entered if made before final rejection","The amendment is entered if accompanied by a declaration","The amendment converts the application to a CIP automatically"],a:1,
  why:"No amendment may introduce new matter into the disclosure. The remedy for an applicant who needs the new material is a continuation-in-part, which carries the later filing date for those claims.",
  cite:"35 U.S.C. 132(a); MPEP 2163.06, 608.04"},
 {q:"Claim 1 recites a widget comprising A and B. Claim 3 recites: 'The widget of claim 1, wherein element B is omitted.' What is the proper treatment?",
  o:["It is a proper dependent claim","It is improper under 112(d) because it does not further limit the claim from which it depends","It is improper under 112(b) only","It is proper if claim 1 uses 'comprising'","It should be rejected under 102"],a:1,
  why:"A dependent claim must include every limitation of the claim from which it depends and further limit it. Omitting a limitation makes it improper under 112(d).",
  cite:"35 U.S.C. 112(d); MPEP 608.01(n)"},
 {q:"A claim recites 'means for fastening.' The specification discloses no structure for fastening. Which is most correct?",
  o:["The claim covers all fasteners known in the art","The claim is indefinite under 112(b) because no corresponding structure is disclosed","The claim is enabled by the knowledge of one skilled in the art","The limitation is simply ignored","The claim must be rejected under 101"],a:1,
  why:"A 112(f) limitation is construed to cover the corresponding structure described in the specification and its equivalents. Where none is disclosed, the claim fails for indefiniteness.",
  cite:"35 U.S.C. 112(b), (f); MPEP 2181, 2185"},
 {q:"Which is most correct regarding best mode after the AIA?",
  o:["It is no longer required in the specification","It is still required by 112(a), but failure to disclose it cannot be used to cancel, invalidate, or hold a claim unenforceable","It applies only to applications filed before 2011","It must be updated in each continuation","It applies only to methods"],a:1,
  why:"The AIA left the 112(a) best mode requirement in place while removing failure to disclose the best mode as a defense in litigation or a basis for cancellation.",
  cite:"35 U.S.C. 112(a), 282(b); MPEP 2165"},
 {q:"What triggers the presumption that 35 U.S.C. 112(f) applies to a claim limitation?",
  o:["Any recitation of a function","Use of the word 'means' or a generic placeholder, coupled with functional language, without reciting sufficient structure to perform the function","Any limitation drafted in the alternative","Use of the transitional phrase 'comprising'","Any limitation in a dependent claim"],a:1,
  why:"The three-prong analysis asks whether the limitation uses 'means' or a generic placeholder, whether it is modified by functional language, and whether it recites sufficient structure for performing that function.",
  cite:"MPEP 2181"},
 {q:"During examination, the standard for indefiniteness under 112(b) is:",
  o:["Whether the claim is insolubly ambiguous","Whether the claim, read in light of the specification and prosecution history, is unclear to a person of ordinary skill in the art","Whether any reasonable interpretation is possible","Whether the claim is broader than the disclosure","Whether the claim uses relative terms"],a:1,
  why:"Because claims can be amended during prosecution, the Office applies a lower threshold for ambiguity than a court, asking whether the claim is unclear when read in light of the specification by a skilled artisan.",
  cite:"MPEP 2173.02"}
]},

{id:"s101",track:"II",fig:"2.7",title:"Section 101 — Eligibility and Utility",
 blurb:"The statutory categories, the Alice/Mayo framework, and what utility requires.",
 teach:[{h:"Two questions, in order",p:[
  "[[eligibility|Eligibility]] under 101 starts with the categories: is the claim to a process, machine, manufacture, or composition of matter? A claim to a signal per se, or to a human organism, is out at this step regardless of anything else.",
  "If it is in a category, the [[alice|Alice/Mayo]] analysis runs. Step 2A prong one asks whether the claim recites a [[exception|judicial exception]] — an abstract idea, a law of nature, or a natural phenomenon. Prong two asks whether the claim as a whole integrates that exception into a practical application, for instance by improving the functioning of a computer or applying it in a meaningful way beyond generally linking it to a technological environment. If it does, the claim is eligible and the analysis stops.",
  "Only if the claim recites an exception and does not integrate it does Step 2B ask whether the additional elements, individually and in combination, amount to significantly more — an inventive concept beyond well-understood, routine, conventional activity."]},
  {h:"Utility",p:[
   "Section 101 also requires [[utility|utility]], which the Office reads as specific, substantial, and credible. A rejection for lack of utility under 101 should normally be accompanied by a rejection under 112(a), because a specification that fails to disclose a use also fails to teach how to use the invention."]}],
 qs:[
 {q:"Which of the following is NOT a statutory category under 35 U.S.C. 101?",
  o:["Process","Machine","Manufacture","Composition of matter","Apparatus for transmitting a signal per se"],a:4,
  why:"A transitory propagating signal per se does not fall within any of the four statutory categories, regardless of how useful or novel it may be.",
  cite:"35 U.S.C. 101; MPEP 2106.03"},
 {q:"In Step 2A prong two of the eligibility analysis, the examiner evaluates whether:",
  o:["The claim recites a judicial exception","The claim as a whole integrates the recited judicial exception into a practical application","The additional elements are well-understood, routine, and conventional","The claim is novel over the prior art","The claim is enabled"],a:1,
  why:"Prong one identifies whether an exception is recited; prong two asks about integration into a practical application. Whether elements are well-understood, routine, and conventional is a Step 2B question.",
  cite:"MPEP 2106.04(d), 2106.05"},
 {q:"A claim is found to integrate a judicial exception into a practical application at Step 2A prong two. What follows?",
  o:["The examiner proceeds to Step 2B","The claim is eligible and the 101 analysis ends","The claim is eligible only if it is also novel","A 101 rejection is still required","The claim must be rejected under 112(b)"],a:1,
  why:"If the exception is integrated into a practical application, the claim is not directed to the exception and is eligible. Step 2B is reached only when it is not integrated.",
  cite:"MPEP 2106.04(d)"},
 {q:"The Office requires that an asserted utility be:",
  o:["Novel, useful, and nonobvious","Specific, substantial, and credible","Commercial, tested, and documented","Immediate, medical, and proven","Enabled, described, and definite"],a:1,
  why:"An asserted utility must be specific to the claimed subject matter, substantial (a real-world use), and credible to a person of ordinary skill.",
  cite:"MPEP 2107.01"},
 {q:"A rejection under 101 for lack of utility should normally be accompanied by a rejection under:",
  o:["35 U.S.C. 102","35 U.S.C. 103","35 U.S.C. 112(a) for failure to teach how to use the invention","35 U.S.C. 112(b)","35 U.S.C. 251"],a:2,
